          const banner = writeBanner(path.join(RES, 'tv_banner.png'), String(config.logo_url || ''), String(config.theme_color || '#4F46E5'));
          console.log('MYAPPS_TV_MANIFEST_PATCHED ' + JSON.stringify({ banner, manifest: true, runtime: true }));
          
          // 4. A launch screen shaped for a television, never the phone's portrait artwork.
          const tvSplashUrl = String(config.splash_screen_url || '');
          if (tvSplashUrl) {
            try {
              execFileSync('curl', ['-sSL', '--fail', tvSplashUrl, '-o', '/tmp/myapps-tv-splash.png'], { stdio: 'inherit' });
              const shapes = [
                ['drawable', 1920, 1080],
                ['drawable-xhdpi', 1280, 720],
                ['drawable-land-mdpi', 480, 320],
                ['drawable-land-hdpi', 800, 480],
                ['drawable-land-xhdpi', 1280, 720],
                ['drawable-land-xxhdpi', 1920, 1080],
                ['drawable-land-xxxhdpi', 1920, 1080],
              ];
              for (const shape of shapes) {
                const dir = path.join(MAIN, 'res', shape[0]);
                fs.mkdirSync(dir, { recursive: true });
                execFileSync(
                  'convert',
                  ['/tmp/myapps-tv-splash.png', '-background', 'none', '-gravity', 'center',
                    '-resize', shape[1] + 'x' + shape[2] + '^', '-extent', shape[1] + 'x' + shape[2], '-strip',
                    'PNG32:' + path.join(dir, 'splash.png')],
                  { stdio: 'inherit' }
                );
              }
              console.log('MYAPPS_TV_SPLASH_APPLIED 1920x1080');
            } catch (error) {
              console.log('::warning::The TV splash screen could not be applied - keeping the template splash.');
            }
          }
          MYAPPS_SCRIPT
          node /tmp/myapps-apply-tv.cjs
          (cd wrapper && npx cap copy android)
          cat > /tmp/myapps-verify-tv.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const manifest = fs.readFileSync('wrapper/android/app/src/main/AndroidManifest.xml', 'utf8');
          const assets = 'wrapper/android/app/src/main/assets/public';
          const html = fs.readFileSync(assets + '/index.html', 'utf8');
          const checks = {
            leanback: manifest.includes('android.software.leanback'),
            touchscreenOptional: /android.hardware.touchscreen"\s+android:required="false"/.test(manifest),
            bannerAttribute: /android:banner="@drawable\/tv_banner"/.test(manifest),
            leanbackLauncher: manifest.includes('LEANBACK_LAUNCHER'),
            banner: fs.existsSync('wrapper/android/app/src/main/res/drawable-xhdpi/tv_banner.png'),
            runtime: fs.existsSync(assets + '/myapps-tv.js'),
            entry: html.includes('myapps-tv.js'),
          };
          const failed = Object.keys(checks).filter((key) => !checks[key]);
          if (failed.length) {
            console.log('::error::The Android TV wrapper is incomplete: ' + failed.join(', '));
            process.exit(1);
          }
          console.log('MYAPPS_TV_WRAPPER_READY ' + JSON.stringify(checks));
          MYAPPS_SCRIPT
          node /tmp/myapps-verify-tv.cjs

      - name: Keep links and downloads inside the app
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform||"android"')
          if [ "$PLATFORM" = "ios" ]; then TARGET=ios; else TARGET=android; fi
          mkdir -p wrapper/www
          cat > /tmp/myapps-in-app-browser.js <<'MYAPPS_SCRIPT'
          (function () {
            if (window.__myappsInAppBrowser) return;
            window.__myappsInAppBrowser = true;
          
            var DOWNLOAD = /\.(zip|rar|7z|tar|gz|tgz|bz2|xz|pdf|doc|docx|xls|xlsx|ppt|pptx|csv|txt|rtf|apk|ipa|dmg|pkg|exe|msi|appimage|deb|rpm|mp3|mp4|m4a|mov|avi|mkv|wav|flac|png|jpe?g|gif|webp|bmp|svg|epub|iso|bin)$/i;
          
            function send(url) {
              try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.myappsDownloads) {
                  window.webkit.messageHandlers.myappsDownloads.postMessage(url);
                  return true;
                }
              } catch (error) {
                return false;
              }
              return false;
            }
          
            function isDownload(anchor, href) {
              if (anchor.hasAttribute('download')) return true;
              try {
                return DOWNLOAD.test(new URL(href, window.location.href).pathname);
              } catch (error) {
                return false;
              }
            }
          
            document.addEventListener('click', function (event) {
              var node = event.target;
              if (!node || !node.closest) return;
              var anchor = node.closest('a[href]');
              if (!anchor) return;
              var href = anchor.href;
              if (!/^https?:/i.test(href)) return;
              if (isDownload(anchor, href) && send(href)) {
                event.preventDefault();
                return;
              }
              if (anchor.target && anchor.target !== '_self') {
                event.preventDefault();
                window.location.href = href;
              }
            }, true);
          
            var open = window.open;
            window.open = function (url) {
              if (url && /^https?:/i.test(String(url))) {
                if (send(String(url))) return window;
                window.location.href = String(url);
                return window;
              }
              return open ? open.apply(window, arguments) : null;
            };
          })();
          MYAPPS_SCRIPT
          cat > /tmp/myapps-watermark.js <<'MYAPPS_SCRIPT'
          (function () {
            if (window.__myappsWatermark) return;
            window.__myappsWatermark = true;
          
            function paint() {
              if (document.getElementById('myapps-watermark')) return;
              var badge = document.createElement('div');
              badge.id = 'myapps-watermark';
              badge.setAttribute('role', 'note');
              badge.textContent = 'Built with MyApps Converter';
              badge.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);' +
                'z-index:2147483647;pointer-events:none;padding:5px 11px;border-radius:999px;' +
                'background:rgba(15,17,24,0.78);color:#fff;font:600 11px/1.2 -apple-system,BlinkMacSystemFont,' +
                '"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:0.01em;white-space:nowrap;' +
                'box-shadow:0 6px 18px rgba(15,17,24,0.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);';
              (document.body || document.documentElement).appendChild(badge);
            }
          
            if (document.body) paint();
            else document.addEventListener('DOMContentLoaded', paint);
          })();
          MYAPPS_SCRIPT
          WATERMARK=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.watermark===false?"0":"1"')
          if [ "$WATERMARK" = "1" ]; then cat /tmp/myapps-watermark.js >> /tmp/myapps-in-app-browser.js; fi
          cat > /tmp/myapps-native-browser.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const target = process.argv[2] === 'ios' ? 'ios' : 'android';
          const runtime = fs.readFileSync('/tmp/myapps-in-app-browser.js', 'utf8');
          const MARKER = 'MYAPPS_IN_APP_BROWSER';
          
          function fail(message) {
            console.log('::error::' + message);
            process.exit(1);
          }
          
          // 1. Capacitor hands a navigation to the system browser unless its host is in
          //    allowNavigation. "*" keeps every page - and every window.open - inside the
          //    app's own WebView on both Android and iOS.
          const configFile = 'wrapper/capacitor.config.json';
          if (!fs.existsSync(configFile)) fail('The Capacitor configuration is missing, so the app cannot keep links inside it.');
          const config = JSON.parse(fs.readFileSync(configFile, 'utf8'));
          config.server = config.server || {};
          config.server.allowNavigation = ['*'];
          fs.writeFileSync(configFile, JSON.stringify(config, null, 2));
          
          // 2. The link runtime travels with the web assets so the native side can inject
          //    it into the bundled site and into a wrapped remote website alike.
          fs.mkdirSync('wrapper/www', { recursive: true });
          fs.writeFileSync('wrapper/www/myapps-browser.js', runtime);
          
          function walk(dir, match) {
            if (!fs.existsSync(dir)) return [];
            const found = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) found.push(...walk(full, match));
              else if (match(entry.name)) found.push(full);
            }
            return found;
          }
          
          function patchAndroid() {
            const root = 'wrapper/android/app/src/main/java';
            const mainActivities = walk(root, (name) => name === 'MainActivity.java');
            if (mainActivities.length === 0) {
              console.log('::warning::The Android wrapper has no MainActivity to extend - links may still leave the app.');
              return false;
            }
            const activity = mainActivities[0];
            const folder = path.dirname(activity);
            const source = fs.readFileSync(activity, 'utf8');
            const packageName = (source.match(/^\s*package\s+([\w.]+)\s*;/m) || [])[1];
            if (!packageName) fail('The Android MainActivity has no package name.');
          
            const downloads = path.join(folder, 'MyAppsDownloads.java');
            fs.writeFileSync(
              downloads,
              [
                'package ' + packageName + ';',
                '',
                'import android.app.DownloadManager;',
                'import android.content.Context;',
                'import android.net.Uri;',
                'import android.os.Environment;',
                'import android.webkit.CookieManager;',
                'import android.webkit.DownloadListener;',
                'import android.webkit.URLUtil;',
                'import android.widget.Toast;',
                'import java.io.ByteArrayOutputStream;',
                'import java.io.InputStream;',
                'import java.nio.charset.StandardCharsets;',
                '',
                '/** Saves files opened in the app browser into the device Downloads folder. */',
                'public class MyAppsDownloads implements DownloadListener {',
                '    private final Context context;',
                '',
                '    public MyAppsDownloads(Context context) {',
                '        this.context = context;',
                '    }',
                '',
                '    /** The in-app link runtime shipped with the web assets. */',
                '    public static String readBrowserScript(Context context) {',
                '        try (InputStream input = context.getAssets().open("public/myapps-browser.js")) {',
                '            ByteArrayOutputStream out = new ByteArrayOutputStream();',
                '            byte[] buffer = new byte[4096];',
                '            int read;',
                '            while ((read = input.read(buffer)) != -1) out.write(buffer, 0, read);',
                '            return new String(out.toByteArray(), StandardCharsets.UTF_8);',
                '        } catch (Exception error) {',
                '            return null;',
                '        }',
                '    }',
                '',
                '    @Override',
                '    public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {',
                '        if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) {',
                '            Toast.makeText(context, "This download could not be started.", Toast.LENGTH_SHORT).show();',
                '            return;',
                '        }',
                '        try {',
                '            DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));',
                '            if (mimeType != null) request.setMimeType(mimeType);',
                '            String cookies = CookieManager.getInstance().getCookie(url);',
                '            if (cookies != null) request.addRequestHeader("Cookie", cookies);',
                '            if (userAgent != null) request.addRequestHeader("User-Agent", userAgent);',
                '            String name = URLUtil.guessFileName(url, contentDisposition, mimeType);',
                '            request.setTitle(name);',
                '            request.setDescription("Saved to Downloads");',
                '            request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);',
                '            request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);',
                '            DownloadManager manager = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);',
                '            manager.enqueue(request);',
                '            Toast.makeText(context, "Saving " + name + " to Downloads", Toast.LENGTH_SHORT).show();',
                '        } catch (Exception error) {',
                '            Toast.makeText(context, "The download could not be saved.", Toast.LENGTH_LONG).show();',
                '        }',
                '    }',
                '}',
                '',
              ].join('\n')
            );
          
            if (!source.includes(MARKER)) {
              const setup = [
                '    // ' + MARKER + ': links stay in this WebView and files save to Downloads.',
                '    android.webkit.WebView myappsWebView = getBridge().getWebView();',
                '    if (myappsWebView != null) {',
                '      myappsWebView.getSettings().setSupportMultipleWindows(false);',
                '      myappsWebView.setDownloadListener(new MyAppsDownloads(this));',
                '      final String myappsScript = MyAppsDownloads.readBrowserScript(this);',
                '      if (myappsScript != null) {',
                '        getBridge().addWebViewListener(new com.getcapacitor.WebViewListener() {',
                '          @Override',
                '          public void onPageLoaded(android.webkit.WebView view) {',
                '            view.evaluateJavascript(myappsScript, null);',
                '          }',
                '        });',
                '      }',
                '    }',
              ].join('\n');
          
              let patched = source;
              if (/super\.onCreate\s*\(\s*savedInstanceState\s*\)\s*;/.test(source)) {
                patched = source.replace(/(super\.onCreate\s*\(\s*savedInstanceState\s*\)\s*;)/, '$1\n' + setup);
              } else if (/class\s+MainActivity\s+extends\s+BridgeActivity\s*\{\s*\}/.test(source)) {
                patched = source.replace(
                  /class\s+MainActivity\s+extends\s+BridgeActivity\s*\{\s*\}/,
                  [
                    'class MainActivity extends BridgeActivity {',
                    '  @Override',
                    '  public void onCreate(android.os.Bundle savedInstanceState) {',
                    '    super.onCreate(savedInstanceState);',
                    setup,
                    '  }',
                    '}',
                  ].join('\n')
                );
              } else {
                fail('The Android MainActivity could not be extended with the in-app browser.');
              }
              fs.writeFileSync(activity, patched);
            }
          
            // Downloads on Android 9 and older need this to write to the public folder.
            const manifest = 'wrapper/android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(manifest, 'utf8');
            if (!xml.includes('WRITE_EXTERNAL_STORAGE')) {
              xml = xml.replace(
                /(<manifest\b[^>]*>)/,
                '$1\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'
              );
              fs.writeFileSync(manifest, xml);
            }
            console.log('MYAPPS_BROWSER_READY ' + JSON.stringify({ target: 'android', activity, downloads: true }));
            return true;
          }
          
          function patchIos() {
            const appDelegate = 'wrapper/ios/App/App/AppDelegate.swift';
            if (!fs.existsSync(appDelegate)) {
              console.log('::warning::The iOS wrapper has no AppDelegate to extend - links may still leave the app.');
              return false;
            }
            let swift = fs.readFileSync(appDelegate, 'utf8');
            if (!/^\s*import WebKit\s*$/m.test(swift)) {
              swift = /^\s*import\s+Capacitor\s*$/m.test(swift)
                ? swift.replace(/^(\s*import\s+Capacitor\s*$)/m, '$1\nimport WebKit')
                : swift.replace(/^(\s*import\s+UIKit\s*$)/m, '$1\nimport WebKit');
            }
            if (!swift.includes(MARKER)) {
              swift += [
                '',
                '// ' + MARKER + ': every link opens inside this app and downloads are saved to Files.',
                '@objc(MyAppsBrowserViewController)',
                'public class MyAppsBrowserViewController: CAPBridgeViewController, WKScriptMessageHandler, URLSessionDownloadDelegate {',
                '  private var dialog: UIAlertController?',
                '  private lazy var downloadSession: URLSession = URLSession(configuration: .default, delegate: self, delegateQueue: .main)',
                '',
                '  private func browserScript() -> String? {',
                '    guard let file = Bundle.main.path(forResource: "myapps-browser", ofType: "js", inDirectory: "public") else { return nil }',
                '    return try? String(contentsOfFile: file, encoding: .utf8)',
                '  }',
                '',
                '  override public func webViewConfiguration(for instanceConfiguration: InstanceConfiguration) -> WKWebViewConfiguration {',
                '    let configuration = super.webViewConfiguration(for: instanceConfiguration)',
                '    configuration.userContentController.add(self, name: "myappsDownloads")',
                '    if let script = browserScript() {',
                '      let userScript = WKUserScript(source: script, injectionTime: .atDocumentStart, forMainFrameOnly: true)',
                '      configuration.userContentController.addUserScript(userScript)',
                '    }',
                '    return configuration',
                '  }',
                '',
                '  public func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {',
                '    guard message.name == "myappsDownloads", let text = message.body as? String, let url = URL(string: text) else { return }',
                '    let name = url.lastPathComponent.isEmpty ? "download" : url.lastPathComponent',
                '    show(title: "Downloading", message: name)',
                '    let task = downloadSession.downloadTask(with: url)',
                '    task.taskDescription = name',
                '    task.resume()',
                '  }',
                '',
                '  private func show(title: String, message: String) {',
                '    DispatchQueue.main.async {',
                '      if let dialog = self.dialog {',
                '        dialog.title = title',
                '        dialog.message = message',
                '        return',
                '      }',
                '      let dialog = UIAlertController(title: title, message: message, preferredStyle: .alert)',
                '      dialog.addAction(UIAlertAction(title: "Hide", style: .cancel, handler: { _ in self.dialog = nil }))',
                '      self.present(dialog, animated: true, completion: { self.dialog = dialog })',
                '    }',
                '  }',
                '',
                '  private func finish(title: String, message: String) {',
                '    DispatchQueue.main.async {',
                '      self.dialog?.dismiss(animated: true, completion: { self.dialog = nil })',
                '      let dialog = UIAlertController(title: title, message: message, preferredStyle: .alert)',
                '      dialog.addAction(UIAlertAction(title: "OK", style: .default, handler: nil))',
                '      self.present(dialog, animated: true, completion: nil)',
                '    }',
                '  }',
                '',
                '  public func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didWriteData bytesWritten: Int64, totalBytesWritten: Int64, totalBytesExpectedToWrite: Int64) {',
                '    guard totalBytesExpectedToWrite > 0 else { return }',
                '    let percent = Int((Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)) * 100)',
                '    show(title: "Downloading", message: (downloadTask.taskDescription ?? "file") + " - " + String(percent) + "%")',
                '  }',
                '',
                '  public func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didFinishDownloadingTo location: URL) {',
                '    let name = downloadTask.taskDescription ?? "download"',
                '    guard let folder = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first else {',
                '      finish(title: "Download failed", message: "The file could not be saved.")',
                '      return',
                '    }',
                '    var target = folder.appendingPathComponent(name)',
                '    let base = target.deletingPathExtension().lastPathComponent',
                '    let extensionName = target.pathExtension',
                '    var index = 1',
                '    while FileManager.default.fileExists(atPath: target.path) {',
                '      target = folder.appendingPathComponent(base + " (" + String(index) + ")" + (extensionName.isEmpty ? "" : "." + extensionName))',
                '      index += 1',
                '    }',
                '    do {',
                '      try FileManager.default.moveItem(at: location, to: target)',
                '      finish(title: "Download complete", message: name + " is saved in the Files app.")',
                '    } catch {',
                '      finish(title: "Download failed", message: "The file could not be saved.")',
                '    }',
                '  }',
                '',
                '  public func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {',
                '    guard error != nil else { return }',
                '    finish(title: "Download failed", message: "Check the connection and try again.")',
                '  }',
                '}',
                '',
              ].join('\n');
              fs.writeFileSync(appDelegate, swift);
            }
          
            // The storyboard must instantiate the browser view controller, not the plain one.
            const storyboards = walk('wrapper/ios/App/App', (name) => name === 'Main.storyboard');
            let wired = false;
            for (const storyboard of storyboards) {
              let xml = fs.readFileSync(storyboard, 'utf8');
              if (xml.includes('MyAppsBrowserViewController')) {
                wired = true;
                continue;
              }
              // No customModule: the class lives in the app's own target, so Interface
              // Builder resolves it in whatever module the generated project uses.
              const next = xml.replace(
                /customClass="CAPBridgeViewController"(\s+customModule="Capacitor")?(\s+customModuleProvider="target")?/,
                'customClass="MyAppsBrowserViewController" customModuleProvider="target"'
              );
              if (next !== xml) {
                fs.writeFileSync(storyboard, next);
                wired = true;
              }
            }
            if (!wired) {
              console.log('::warning::The iOS storyboard could not be pointed at the in-app browser.');
              return false;
            }
          
            // Saved downloads are visible in the Files app next to the app.
            const plist = 'wrapper/ios/App/App/Info.plist';
            if (fs.existsSync(plist)) {
              let xml = fs.readFileSync(plist, 'utf8');
              const keys = ['UIFileSharingEnabled', 'LSSupportsOpeningDocumentsInPlace'];
              const missing = keys.filter((key) => !xml.includes('<key>' + key + '</key>'));
              if (missing.length) {
                const entries = missing
                  .map((key) => '  <key>' + key + '</key>\n  <true/>')
                  .join('\n');
                xml = xml.replace(/<\/dict>\s*<\/plist>\s*$/, entries + '\n</dict>\n</plist>\n');
                fs.writeFileSync(plist, xml);
              }
            }
            console.log('MYAPPS_BROWSER_READY ' + JSON.stringify({ target: 'ios', storyboard: true, downloads: true }));
            return true;
          }
          
          // A wrapper that cannot be extended is reported above; the build still runs so
          // the installer is produced with the platform's standard link handling.
          if (target === 'ios') patchIos();
          else patchAndroid();
          MYAPPS_SCRIPT
          node /tmp/myapps-native-browser.cjs "$TARGET"
          (cd wrapper && npx cap copy "$TARGET")

      - name: Compile the APK
        working-directory: wrapper/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Sign the APK with the app signing key
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER=$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          "$(dirname "$APKSIGNER")/zipalign" -f -p 4 wrapper/android/app/build/outputs/apk/debug/app-debug.apk /tmp/app-aligned.apk
          "$APKSIGNER" sign --ks wrapper/keystore/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out app.apk /tmp/app-aligned.apk
          "$APKSIGNER" verify --print-certs app.apk | head -6

      - name: Publish the APK as a public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          gh release create "build-$BUILD_ID" app.apk --title "Build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "build-$BUILD_ID" app.apk --clobber
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/build-$BUILD_ID/app.apk" >> "$GITHUB_ENV"

      - name: Tell MyApps the build succeeded
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifact_url\":\"$APK_URL\"}"

      - name: Tell MyApps the build failed
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"message\":\"The compiler runner failed - open the Actions log for this run.\"}"

  ios:
    if: github.event.client_payload.platform == 'ios'
    # Apple needs a real certificate, so the runner imports the signing secrets
    # before compiling. The ZIP bundle step is injected above the compile step.
    runs-on: macos-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare the iOS wrapper
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          cat > /tmp/myapps-prepare-ios.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const p = JSON.parse(process.env.PAYLOAD || '{}');
          const c = p.app_config || {};
          const slug = String(p.app_name || 'myapp').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'app';
          const offline = ['zip', 'folder', 'github'].includes(String(p.build_type || ''));
          const appId = c.package_name || p.package_name || 'com.myapps.' + slug;
          
          fs.mkdirSync('wrapper/www', { recursive: true });
          const entry = 'wrapper/www/index.html';
          if (!fs.existsSync(entry)) {
            fs.writeFileSync(entry, '<!doctype html><html><head><meta charset="utf-8"><title>Loading</title></head><body style="margin:0;background:#ffffff;color:#111827;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif"><p>Loading&hellip;</p></body></html>');
          }
          
          fs.writeFileSync('wrapper/package.json', JSON.stringify({
            name: 'myapps-ios-wrapper',
            private: true,
            devDependencies: { '@capacitor/cli': '^7.0.0' },
            dependencies: {
              '@capacitor/core': '^7.0.0',
              '@capacitor/ios': '^7.0.0',
              '@capacitor/splash-screen': '^7.0.0'
            }
          }, null, 2));
          
          fs.writeFileSync('wrapper/capacitor.config.json', JSON.stringify({
            appId: appId,
            appName: c.app_name || p.app_name || 'My App',
            webDir: 'www',
            backgroundColor: "#FFFFFF",
            server: offline
              ? { hostname: 'localhost', androidScheme: 'https', iosScheme: 'capacitor', cleartext: false }
              : { url: p.website_url, cleartext: false },
            ios: { backgroundColor: "#FFFFFF"},
            plugins: {
              SplashScreen: {
                launchShowDuration: 1200,
                launchAutoHide: true,
                backgroundColor: "#FFFFFF",
                showSpinner: false
              }
            }
          }, null, 2));
          
          console.log('MYAPPS_IOS_WRAPPER_PREPARED ' + appId);
          MYAPPS_SCRIPT
          node /tmp/myapps-prepare-ios.cjs
          cd wrapper && npm install --no-audit --no-fund && npx cap add ios && npx cap sync ios

      - name: Work out the iOS bundle id and version
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          cat > /tmp/myapps-ios-target.cjs <<'MYAPPS_SCRIPT'
          const p = JSON.parse(process.env.PAYLOAD || '{}');
          const c = p.app_config || {};
          const slug = String(p.app_name || 'myapp').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'app';
          const lines = [
            'BUNDLE_ID=' + (c.package_name || p.package_name || 'com.myapps.' + slug),
            'IOS_VERSION_NAME=' + String(c.version_name || '1.0.0'),
            'IOS_BUILD_NUMBER=' + String(c.version_code || 1),
            'IOS_EXPORT_METHOD=' + (process.env.IOS_EXPORT_METHOD || 'development')
          ];
          console.log(lines.join('\n'));
          MYAPPS_SCRIPT
          node /tmp/myapps-ios-target.cjs > "$RUNNER_TEMP/ios-target.env"
          . "$RUNNER_TEMP/ios-target.env"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "IOS_VERSION_NAME=$IOS_VERSION_NAME" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IOS_EXPORT_METHOD=$IOS_EXPORT_METHOD" >> "$GITHUB_ENV"

      - name: Install the Apple signing certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_CERTIFICATE_P12" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ]; then
            echo "IOS_SIGNING_ERROR=iOS signing is not set up: add IOS_CERTIFICATE_P12 and IOS_CERTIFICATE_PASSWORD to the repo Actions secrets, then build again." >> "$GITHUB_ENV"
            echo "::error::Add IOS_CERTIFICATE_P12 and IOS_CERTIFICATE_PASSWORD to this repository."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/myapps-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MYAPPS_IOS_CERTIFICATE_READY"

      - name: Install the provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "IOS_SIGNING_ERROR=iOS signing is not set up: add IOS_PROVISIONING_PROFILE to the repo Actions secrets, then build again." >> "$GITHUB_ENV"
            echo "::error::Add IOS_PROVISIONING_PROFILE to this repository."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "MYAPPS_IOS_PROFILE=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile $PROFILE_NAME"

      - name: Bundle the uploaded codebase for offline use
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                # A supplied Supabase connection reaches the project's own build too,
                # through the environment variables Vite and Create React App read.
                SUPABASE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");String(p.supabase_url||(p.app_config||{}).supabase_url||"")' || true)
                SUPABASE_ANON_KEY=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");String(p.supabase_anon_key||(p.app_config||{}).supabase_anon_key||"")' || true)
                if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
                  export VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
                  export REACT_APP_SUPABASE_URL="$SUPABASE_URL" REACT_APP_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
                  export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
                  printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nREACT_APP_SUPABASE_URL=%s\nREACT_APP_SUPABASE_ANON_KEY=%s\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
                    "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> .env.production
                  echo "MYAPPS_SUPABASE_ENV the project build reads the supplied Supabase settings"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "wrapper/www"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs wrapper/www
          cat > /tmp/myapps-supabase-env.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const url = String(payload.supabase_url || config.supabase_url || '').trim().replace(/\/+$/, '');
          const key = String(payload.supabase_anon_key || config.supabase_anon_key || '').trim();

          if (!url || !key) {
            console.log('MYAPPS_SUPABASE_SKIPPED no database settings were supplied');
            process.exit(0);
          }
          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the database settings could not be written.');
            process.exit(1);
          }

          const entries = [
            ['VITE_SUPABASE_URL', url],
            ['VITE_SUPABASE_ANON_KEY', key],
            ['REACT_APP_SUPABASE_URL', url],
            ['REACT_APP_SUPABASE_ANON_KEY', key],
            ['NEXT_PUBLIC_SUPABASE_URL', url],
            ['NEXT_PUBLIC_SUPABASE_ANON_KEY', key],
          ];

          function writeEnv(file) {
            const existing = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').split(/\r?\n/) : [];
            const kept = existing.filter((line) => {
              const name = line.split('=')[0].trim();
              return !entries.some((entry) => entry[0] === name);
            });
            while (kept.length && kept[kept.length - 1] === '') kept.pop();
            const body = kept.concat(entries.map((entry) => entry[0] + '=' + entry[1])).join('\n') + '\n';
            fs.writeFileSync(file, body);
          }
          writeEnv(path.join(root, '.env'));
          writeEnv(path.join(root, '.env.production'));

          const runtime = { supabaseUrl: url, supabaseAnonKey: key };
          fs.writeFileSync(path.join(root, 'supabase.config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (fs.existsSync(entry)) {
            let html = fs.readFileSync(entry, 'utf8');
            if (html.indexOf('__MYAPPS_SUPABASE__') === -1) {
              const bag = JSON.stringify(runtime);
              const tag = '<script>window.__MYAPPS_SUPABASE__=' + bag +
                ';window.SUPABASE_URL=' + JSON.stringify(url) +
                ';window.SUPABASE_ANON_KEY=' + JSON.stringify(key) + ';</script>';
              html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
              fs.writeFileSync(entry, html);
            }
          }

          console.log('MYAPPS_SUPABASE_ENV ' + JSON.stringify({ url: url, keyLength: key.length, files: ['.env', '.env.production', 'supabase.config.json'] }));
          MYAPPS_SCRIPT
          node /tmp/myapps-supabase-env.cjs wrapper/www
          cat > /tmp/myapps-sync-runtime.js <<'MYAPPS_SCRIPT'
          (function () {
            var cfg = window.__MYAPPS_SYNC__ || {};
            var QUEUE_KEY = 'myapps.sync.queue';
            var CLIENT_KEY = 'myapps.sync.client';
            var MAX_ITEMS = 200;
            var MAX_ATTEMPTS = 5;
            var status = 'idle';
            var lastError = '';
            var busy = false;
            var chip = null;
            var hideTimer = null;

            function readQueue() {
              try {
                var raw = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
              } catch (error) {
                return [];
              }
            }

            function saveQueue(items) {
              try {
                localStorage.setItem(QUEUE_KEY, JSON.stringify(items.slice(-MAX_ITEMS)));
              } catch (error) {}
            }

            function clientId() {
              var existing = '';
              try {
                existing = localStorage.getItem(CLIENT_KEY) || '';
                if (!existing) {
                  existing = 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
                  localStorage.setItem(CLIENT_KEY, existing);
                }
              } catch (error) {
                existing = 'c-anonymous';
              }
              return existing;
            }

            function online() {
              return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
            }

            function newId() {
              return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            function announce() {
              try {
                window.dispatchEvent(
                  new CustomEvent('myapps:sync', {
                    detail: { status: status, pending: readQueue().length, error: lastError, enabled: !!cfg.endpoint },
                  })
                );
              } catch (error) {}
            }

            function label(state, pending) {
              if (!cfg.endpoint) return state === 'offline' ? 'Offline - bundled app' : '';
              if (state === 'offline') return pending ? 'Offline - ' + pending + ' waiting to sync' : 'Offline - changes saved on this device';
              if (state === 'syncing') return 'Syncing ' + pending + ' change' + (pending === 1 ? '' : 's') + '...';
              if (state === 'pending') return pending + ' change' + (pending === 1 ? '' : 's') + ' waiting to sync';
              if (state === 'synced') return 'All changes synced';
              if (state === 'failed') return 'Sync failed - tap to retry';
              return '';
            }

            function ensureChip() {
              if (chip || !document.body) return chip;
              chip = document.createElement('div');
              chip.id = 'myapps-sync-chip';
              chip.setAttribute('role', 'status');
              chip.setAttribute('aria-live', 'polite');
              chip.style.cssText = [
                'position:fixed', 'left:50%', 'transform:translateX(-50%)',
