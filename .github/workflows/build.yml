            function drop(ids) {
              var remove = {};
              ids.forEach(function (id) {
                remove[id] = true;
              });
              var kept = readQueue().filter(function (item) {
                return !remove[item.id];
              });
              saveQueue(kept);
              return kept;
            }

            function markAttempts(ids) {
              var flagged = {};
              ids.forEach(function (id) {
                flagged[id] = true;
              });
              saveQueue(
                readQueue().map(function (item) {
                  if (!flagged[item.id]) return item;
                  return Object.assign({}, item, { attempts: (item.attempts || 0) + 1 });
                })
              );
            }

            function flush() {
              var queue = readQueue();
              if (!cfg.endpoint || busy || !online() || queue.length === 0) {
                if (queue.length && !online()) {
                  status = 'offline';
                  render();
                  announce();
                }
                return Promise.resolve(false);
              }

              busy = true;
              status = 'syncing';
              lastError = '';
              render();
              announce();

