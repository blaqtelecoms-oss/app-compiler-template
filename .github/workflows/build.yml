name: Build mobile app
run-name: "MyApps ${{ github.event.client_payload.build_id }} (${{ github.event.client_payload.platform }})"

on:
  repository_dispatch:
    types: [myapps-build, build_app]

permissions:
  contents: write

jobs:
  android:
    if: github.event.client_payload.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create the native wrapper
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p wrapper/www
          cat > wrapper/www/index.html <<'HTML'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Loading</title></head>
            <body style="margin:0;background:#ffffff;color:#111827;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif">
              <p>Loading&hellip;</p>
            </body>
          </html>
          HTML
          node -e '
            const fs = require("fs");
            const p = JSON.parse(process.env.PAYLOAD || "{}");
            const slug = String(p.app_name || "myapp").toLowerCase().replace(/[^a-z0-9]+/g, "") || "app";
            const appId = p.package_name || ("com.myapps." + slug);
            fs.writeFileSync("wrapper/package.json", JSON.stringify({
              name: "myapps-wrapper",
              private: true,
              devDependencies: { "@capacitor/cli": "^7.0.0" },
              dependencies: {
                "@capacitor/core": "^7.0.0",
                "@capacitor/android": "^7.0.0",
                "@capacitor/splash-screen": "^7.0.0"
              }
            }, null, 2));
            fs.writeFileSync("wrapper/capacitor.config.json", JSON.stringify({
              appId: appId,
              appName: p.app_name || "My App",
              webDir: "www",
              // This window sits behind the WebView while the remote site loads.
              // Keeping it neutral stops the theme colour flashing after the splash.
              backgroundColor: "#FFFFFF",
              server: { url: p.website_url, cleartext: false },
              android: { backgroundColor: "#FFFFFF" },
              plugins: {
                SplashScreen: {
                  launchShowDuration: 1200,
                  launchAutoHide: true,
                  // Keep every native surface neutral; the splash artwork covers this.
                  backgroundColor: "#FFFFFF",
                  androidSplashResourceName: "splash",
                  androidScaleType: "CENTER_CROP",
                  showSpinner: false,
                  splashFullScreen: true,
                  splashImmersive: false
                }
              }
            }, null, 2));
          '

      - name: Generate the Android project
        working-directory: wrapper
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      # Each app ships its own icon and splash screen. Both are public uploads
      # from the project, so they can be fetched straight into the native assets.
      - name: Keep the same signing key for updates
        working-directory: wrapper
        run: |
          mkdir -p "$HOME/.android" keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -keystore keystore/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git add -f keystore/debug.keystore
            git -c user.name=myapps-bot -c user.email=builds@myapps.local commit -m "Store the app signing key so updates install over each other" >/dev/null || true
            git push origin "HEAD:${{ github.event.repository.default_branch }}" || echo "::warning::Could not store the signing key in the repository."
          fi
          cp keystore/debug.keystore "$HOME/.android/debug.keystore"
          echo "Signing key ready - updates install over the previous build."
      - name: Stamp the app version
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          VERSION_NAME=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.version_name||"1.0.0"')
          VERSION_CODE=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.version_code||1')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/; s/versionCode [0-9]+/versionCode $VERSION_CODE/" wrapper/android/app/build.gradle
          echo "Stamped version $VERSION_NAME (build $VERSION_CODE)"
          grep -E "versionName|versionCode" wrapper/android/app/build.gradle
      - name: Apply the app icon and splash screen
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          APP_ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          APP_SPLASH_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.splash_screen_url||""')

          if [ -z "$APP_ICON_URL" ] && [ -z "$APP_SPLASH_URL" ]; then
            echo "This app has no uploaded icon or splash screen - keeping the template artwork."
            exit 0
          fi

          command -v convert >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y imagemagick; }
          RES=wrapper/android/app/src/main/res

          if [ -n "$APP_ICON_URL" ]; then
            if curl -sSL --fail "$APP_ICON_URL" -o /tmp/app-icon.png; then
              echo "Applying the uploaded app icon"
              # An adaptive icon would keep the template foreground, so plain PNGs are used.
              rm -rf "$RES/mipmap-anydpi-v26"
              for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
                density=${pair%%:*}
                size=${pair##*:}
                mkdir -p "$RES/mipmap-$density"
                convert /tmp/app-icon.png -background none -gravity center \
                  -resize "${size}x${size}^" -extent "${size}x${size}" -strip \
                  "PNG32:$RES/mipmap-$density/ic_launcher.png"
                cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
              done
            else
              echo "::warning::The app icon could not be downloaded - keeping the template icon."
            fi
          fi

          if [ -n "$APP_SPLASH_URL" ]; then
            if curl -sSL --fail "$APP_SPLASH_URL" -o /tmp/app-splash.png; then
              echo "Applying the uploaded splash screen"
              splash() {
                mkdir -p "$RES/$1"
                convert /tmp/app-splash.png -gravity center -resize "$2x$3^" -extent "$2x$3" -strip \
                  "PNG32:$RES/$1/splash.png"
              }
              splash drawable 1080 1920
              splash drawable-port-mdpi 320 480
              splash drawable-port-hdpi 480 800
              splash drawable-port-xhdpi 720 1280
              splash drawable-port-xxhdpi 960 1600
              splash drawable-port-xxxhdpi 1280 1920
              splash drawable-land-mdpi 480 320
              splash drawable-land-hdpi 800 480
              splash drawable-land-xhdpi 1280 720
              splash drawable-land-xxhdpi 1600 960
              splash drawable-land-xxxhdpi 1920 1280
            else
              echo "::warning::The splash screen could not be downloaded - keeping the template splash."
            fi
          fi

      - name: Bundle the uploaded codebase for offline use
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "wrapper/www"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs wrapper/www
          cat > /tmp/myapps-sync-runtime.js <<'MYAPPS_SCRIPT'
          (function () {
            var cfg = window.__MYAPPS_SYNC__ || {};
            var QUEUE_KEY = 'myapps.sync.queue';
            var CLIENT_KEY = 'myapps.sync.client';
            var MAX_ITEMS = 200;
            var MAX_ATTEMPTS = 5;
            var status = 'idle';
            var lastError = '';
            var busy = false;
            var chip = null;
            var hideTimer = null;

            function readQueue() {
              try {
                var raw = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
              } catch (error) {
                return [];
              }
            }

            function saveQueue(items) {
              try {
                localStorage.setItem(QUEUE_KEY, JSON.stringify(items.slice(-MAX_ITEMS)));
              } catch (error) {}
            }

            function clientId() {
              var existing = '';
              try {
                existing = localStorage.getItem(CLIENT_KEY) || '';
                if (!existing) {
                  existing = 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
                  localStorage.setItem(CLIENT_KEY, existing);
                }
              } catch (error) {
                existing = 'c-anonymous';
              }
              return existing;
            }

            function online() {
              return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
            }

            function newId() {
              return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            function announce() {
              try {
                window.dispatchEvent(
                  new CustomEvent('myapps:sync', {
                    detail: { status: status, pending: readQueue().length, error: lastError, enabled: !!cfg.endpoint },
                  })
                );
              } catch (error) {}
            }

            function label(state, pending) {
              if (!cfg.endpoint) return state === 'offline' ? 'Offline - bundled app' : '';
              if (state === 'offline') return pending ? 'Offline - ' + pending + ' waiting to sync' : 'Offline - changes saved on this device';
              if (state === 'syncing') return 'Syncing ' + pending + ' change' + (pending === 1 ? '' : 's') + '...';
              if (state === 'pending') return pending + ' change' + (pending === 1 ? '' : 's') + ' waiting to sync';
              if (state === 'synced') return 'All changes synced';
              if (state === 'failed') return 'Sync failed - tap to retry';
              return '';
            }

            function ensureChip() {
              if (chip || !document.body) return chip;
              chip = document.createElement('div');
              chip.id = 'myapps-sync-chip';
              chip.setAttribute('role', 'status');
              chip.setAttribute('aria-live', 'polite');
              chip.style.cssText = [
                'position:fixed', 'left:50%', 'transform:translateX(-50%)',
                'bottom:calc(14px + env(safe-area-inset-bottom,0px))',
                'z-index:2147483000', 'max-width:calc(100vw - 28px)',
                'padding:7px 13px', 'border-radius:999px',
                'font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
                'background:rgba(17,24,39,0.92)', 'color:#fff', 'box-shadow:0 8px 22px -10px rgba(0,0,0,0.6)',
                'opacity:0', 'transition:opacity 180ms ease', 'pointer-events:none', 'text-align:center',
              ].join(';');
              chip.addEventListener('click', function () {
                if (cfg.endpoint) flush();
              });
              document.body.appendChild(chip);
              return chip;
            }

            function render() {
              var pending = readQueue().length;
              if (!cfg.showStatus) return;
              var text = label(status, pending);
              var node = ensureChip();
              if (!node) return;
              if (!text) {
                node.style.opacity = '0';
                node.style.pointerEvents = 'none';
                return;
              }
              node.textContent = text;
              node.style.opacity = '1';
              node.style.pointerEvents = status === 'failed' ? 'auto' : 'none';
              node.style.cursor = status === 'failed' ? 'pointer' : 'default';
              node.style.background = status === 'failed' ? 'rgba(185,28,28,0.94)' : 'rgba(17,24,39,0.92)';
              if (hideTimer) clearTimeout(hideTimer);
              if (status === 'synced') {
                hideTimer = setTimeout(function () {
                  if (chip) chip.style.opacity = '0';
                }, 3000);
              }
            }

            function drop(ids) {
              var remove = {};
              ids.forEach(function (id) {
                remove[id] = true;
              });
              var kept = readQueue().filter(function (item) {
                return !remove[item.id];
              });
              saveQueue(kept);
              return kept;
            }

            function markAttempts(ids) {
              var flagged = {};
              ids.forEach(function (id) {
                flagged[id] = true;
              });
              saveQueue(
                readQueue().map(function (item) {
                  if (!flagged[item.id]) return item;
                  return Object.assign({}, item, { attempts: (item.attempts || 0) + 1 });
                })
              );
            }

            function flush() {
              var queue = readQueue();
              if (!cfg.endpoint || busy || !online() || queue.length === 0) {
                if (queue.length && !online()) {
                  status = 'offline';
                  render();
                  announce();
                }
                return Promise.resolve(false);
              }

              busy = true;
              status = 'syncing';
              lastError = '';
              render();
              announce();

              var controller = typeof AbortController === 'function' ? new AbortController() : null;
              var timeout = controller ? setTimeout(function () { controller.abort(); }, 15000) : null;

              return fetch(cfg.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller ? controller.signal : undefined,
                body: JSON.stringify({ client: clientId(), app: cfg.appName || '', operations: queue }),
              })
                .then(function (response) {
                  if (!response.ok) throw new Error('The sync service answered ' + response.status + '.');
                  return response.json().catch(function () { return {}; });
                })
                .then(function (result) {
                  var acked = Array.isArray(result && result.acknowledged) ? result.acknowledged : queue.map(function (item) { return item.id; });
                  var conflicts = Array.isArray(result && result.conflicts) ? result.conflicts : [];
                  var rejected = Array.isArray(result && result.rejected) ? result.rejected : [];
                  var kept = drop(acked.filter(function (id) { return conflicts.indexOf(id) === -1; }));
                  if (conflicts.length || rejected.length) markAttempts(conflicts.concat(rejected));
                  lastError = conflicts.length ? 'The service reported conflicting changes that were kept on this device.' : '';
                  status = kept.length ? 'failed' : 'synced';
                  return pull(kept.length);
                })
                .catch(function (error) {
                  lastError = String((error && error.message) || 'The sync service could not be reached.');
                  status = 'failed';
                  announce();
                  return false;
                })
                .then(function (result) {
                  busy = false;
                  if (timeout) clearTimeout(timeout);
                  render();
                  announce();
                  return result;
                });
            }

            function pull(keptPending) {
              if (!cfg.pullPath) return keptPending;
              return fetch(cfg.endpoint.replace(/\/+$/, '') + cfg.pullPath, { headers: { Accept: 'application/json' } })
                .then(function (response) {
                  return response.ok ? response.json() : null;
                })
                .then(function (data) {
                  if (data) {
                    try {
                      window.dispatchEvent(new CustomEvent('myapps:sync:data', { detail: data }));
                    } catch (error) {}
                  }
                  return keptPending;
                })
                .catch(function () {
                  return keptPending;
                });
            }

            function refresh() {
              if (!online()) {
                status = 'offline';
                render();
                announce();
                return;
              }
              if (!cfg.endpoint) {
                status = 'idle';
                render();
                announce();
                return;
              }
              if (readQueue().length === 0) {
                status = 'idle';
                render();
                announce();
                return;
              }
              flush();
            }

            window.MyApps = window.MyApps || {};
            window.MyApps.sync = {
              enabled: function () { return !!cfg.endpoint; },
              pending: function () { return readQueue().length; },
              status: function () { return status; },
              flush: flush,
              push: function (operation) {
                var op = operation || {};
                var queue = readQueue();
                var item = {
                  id: op.id ? String(op.id) : newId(),
                  path: String(op.path || '/'),
                  method: String(op.method || 'POST').toUpperCase(),
                  body: op.body === undefined ? null : op.body,
                  at: new Date().toISOString(),
                  attempts: 0,
                };
                queue.push(item);
                saveQueue(queue);
                status = online() ? 'pending' : 'offline';
                render();
                announce();
                flush();
                return item.id;
              },
              clear: function () {
                saveQueue([]);
                lastError = '';
                status = online() ? 'idle' : 'offline';
                render();
                announce();
              },
            };

            window.addEventListener('online', refresh);
            window.addEventListener('offline', function () {
              status = 'offline';
              render();
              announce();
            });
            document.addEventListener('visibilitychange', function () {
              if (!document.hidden && online() && cfg.endpoint && readQueue().length) flush();
            });
            setInterval(function () {
              if (cfg.endpoint && online() && readQueue().length && status !== 'syncing') flush();
            }, 45000);
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', refresh);
            } else {
              refresh();
            }
          })();
          MYAPPS_SCRIPT
          cat > /tmp/myapps-inject-sync.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.sync_endpoint || '').trim();
          const endpoint = /^https:\/\/\S{8,500}$/i.test(raw) ? raw : '';
          const pullPath = /^\/[\w\-./?=&\u0025]{1,120}$/.test(String(config.sync_pull_path || '')) ? String(config.sync_pull_path) : '';
          const entry = path.join(root, 'index.html');

          if (!fs.existsSync(entry)) {
            console.error('::error::The bundled site has no index.html.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (/^\s*-\s+name:\s/m.test(html) || html.indexOf('MYAPPS_SCRIPT') !== -1) {
            console.error('::error::The archive produced build instructions instead of a website. Upload the built site (its dist folder), not the repository root.');
            process.exit(1);
          }
          if (!/<html/i.test(html) || !/<body/i.test(html) || !/<head/i.test(html)) {
            console.error('::error::index.html is not a browser page. Upload a build whose index.html opens in a browser.');
            process.exit(1);
          }

          const titleMatch = html.match(/<title[^>]*>([^<]{0,120})<\/title>/i);
          const title = titleMatch ? titleMatch[1].trim() : '';

          fs.writeFileSync(path.join(root, 'myapps-sync.js'), fs.readFileSync('/tmp/myapps-sync-runtime.js', 'utf8'));
          const bag = {
            endpoint: endpoint,
            pullPath: pullPath,
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            showStatus: true,
          };
          const injected = '<script>window.__MYAPPS_SYNC__=' + JSON.stringify(bag).replace(/</g, '\u003c') + ';</script>' +
            '<script src="/myapps-sync.js" defer></script>';

          if (html.indexOf('myapps-sync.js') === -1) {
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => injected + '</body>') : html + injected;
            fs.writeFileSync(entry, html);
          }

          const assets = (html.match(/<(?:script|link)\b[^>]*\b(?:src|href)\s*=/gi) || []).length;
          console.log('MYAPPS_APP_ENTRYPOINT ' + JSON.stringify({
            title: title.slice(0, 80),
            assets: assets,
            offline: true,
            sync: !!endpoint,
          }));
          MYAPPS_SCRIPT
          node /tmp/myapps-inject-sync.cjs wrapper/www
          cat > /tmp/myapps-configure-mobile.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const file = 'wrapper/capacitor.config.json';
          if (!fs.existsSync(file)) throw new Error('The Capacitor JSON configuration is missing.');
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.webDir = 'www';
          config.server = { hostname: 'localhost', androidScheme: 'https', iosScheme: 'capacitor', cleartext: false };
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          console.log('MYAPPS_LOCAL_ORIGIN_CONFIGURED https://localhost capacitor://localhost webDir=www');
          MYAPPS_SCRIPT
          node /tmp/myapps-configure-mobile.cjs
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD).platform||"android"')
          (cd wrapper && npx cap copy "$PLATFORM")

      - name: Verify the local bundle server
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          cat > /tmp/myapps-verify-mobile.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const assert = require('assert/strict');
          const platform = process.argv[2];
          const android = platform === 'android';
          const nativeRoot = android ? 'wrapper/android/app/src/main/assets' : 'wrapper/ios/App/App';
          const config = JSON.parse(fs.readFileSync(nativeRoot + '/capacitor.config.json', 'utf8'));
          assert.equal(config.webDir, 'www');
          assert.equal(config.server.hostname, 'localhost');
          assert.equal(config.server.androidScheme, 'https');
          assert.equal(config.server.iosScheme, 'capacitor');
          assert.ok(!config.server.url, 'A remote URL overrides the embedded asset server.');
          const bundle = path.resolve('wrapper/www');
          const nativeBundle = path.resolve(nativeRoot, 'public');
          let checked = 0;
          function verify(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const source = path.join(dir, entry.name);
              if (entry.isDirectory()) { verify(source); continue; }
              const copied = path.join(nativeBundle, path.relative(bundle, source));
              const hash = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              assert.equal(hash(copied), hash(source), 'Native asset mismatch: ' + source);
              checked++;
            }
          }
          verify(bundle);
          const shippedHtml = fs.readFileSync(path.join(nativeBundle, 'index.html'), 'utf8');
          assert.match(shippedHtml, /<base href="\/">/);
          // The shipped page must be the app itself, with the offline sync runtime in it.
          assert.ok(!/^\s*-\s+name:\s/m.test(shippedHtml), 'The shipped index.html holds compiler instructions instead of the app.');
          assert.ok(!/MYAPPS_SCRIPT/.test(shippedHtml), 'The shipped index.html holds compiler instructions instead of the app.');
          assert.match(shippedHtml, /myapps-sync\.js/, 'The offline sync runtime is missing from the shipped app.');
          // Verify the generated app, not private Capacitor source formatting. Constructor
          // arguments and native source paths can change without changing server behavior.
          console.log('MYAPPS_LOCAL_ORIGIN_VERIFIED ' + JSON.stringify({ platform, origin: android ? 'https://localhost/' : 'capacitor://localhost/', level: 'configuration', checked, nativeAssets: true, entry: true, syncRuntime: true }));
          MYAPPS_SCRIPT
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD).platform||"android"')
          node /tmp/myapps-verify-mobile.cjs "$PLATFORM"

      - name: Add the Android TV wrapper
        if: github.event.client_payload.platform == 'android_tv'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          cat > /tmp/myapps-tv-runtime.js <<'MYAPPS_SCRIPT'
          (function () {
            if (window.__MYAPPS_TV__) return;
            window.__MYAPPS_TV__ = true;
          
            var FOCUSABLE = [
              'a[href]',
              'button:not([disabled])',
              'input:not([disabled])',
              'select:not([disabled])',
              'textarea:not([disabled])',
              '[tabindex]:not([tabindex="-1"])',
              '[role="button"]',
              '[role="link"]',
              '[contenteditable="true"]'
            ].join(',');
          
            var CSS = [
              'html[data-myapps-tv]{--myapps-tv-focus:#818cf8;}',
              'html[data-myapps-tv] body{overflow-x:hidden;}',
              'html[data-myapps-tv] :focus{outline:3px solid var(--myapps-tv-focus)!important;outline-offset:3px!important;}',
              'html[data-myapps-tv] a,html[data-myapps-tv] button,html[data-myapps-tv] [role="button"]{transition:transform .14s ease,box-shadow .14s ease;}',
              'html[data-myapps-tv] a:focus,html[data-myapps-tv] button:focus,html[data-myapps-tv] [role="button"]:focus{transform:scale(1.04);}',
              'html[data-myapps-tv] input,html[data-myapps-tv] select,html[data-myapps-tv] textarea{font-size:1.05em;}',
              'html[data-myapps-tv] ::-webkit-scrollbar{width:10px;height:10px;}'
            ].join('\n');
          
            function installStyles() {
              if (document.getElementById('myapps-tv-style')) return;
              var style = document.createElement('style');
              style.id = 'myapps-tv-style';
              style.textContent = CSS;
              (document.head || document.documentElement).appendChild(style);
            }
          
            function isVisible(element) {
              var rect = element.getBoundingClientRect();
              if (rect.width < 2 || rect.height < 2) return false;
              var computed = window.getComputedStyle(element);
              return computed.visibility !== 'hidden' && computed.display !== 'none' && computed.opacity !== '0';
            }
          
            function focusable() {
              return Array.prototype.slice.call(document.querySelectorAll(FOCUSABLE)).filter(isVisible);
            }
          
            function current() {
              var element = document.activeElement;
              return element && element !== document.body && element !== document.documentElement ? element : null;
            }
          
            function focusElement(element) {
              if (!element || typeof element.focus !== 'function') return;
              element.focus({ preventScroll: true });
              if (element.scrollIntoView) {
                element.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
              }
            }
          
            // Nearest neighbour in the pressed direction, so the remote never dead-ends.
            function move(direction) {
              var list = focusable();
              if (!list.length) return;
              var from = current() || list[0];
              var box = from.getBoundingClientRect();
              var cx = box.left + box.width / 2;
              var cy = box.top + box.height / 2;
              var best = null;
              var bestScore = Infinity;
              for (var i = 0; i < list.length; i++) {
                var element = list[i];
                if (element === from) continue;
                var rect = element.getBoundingClientRect();
                var dx = rect.left + rect.width / 2 - cx;
                var dy = rect.top + rect.height / 2 - cy;
                var forward = direction === 'left' ? -dx : direction === 'right' ? dx : direction === 'up' ? -dy : dy;
                if (forward <= 4) continue;
                var sideways = direction === 'left' || direction === 'right' ? Math.abs(dy) : Math.abs(dx);
                var score = forward + sideways * 2;
                if (score < bestScore) {
                  bestScore = score;
                  best = element;
                }
              }
              if (!best) best = list[(list.indexOf(from) + 1) % list.length];
              focusElement(best);
            }
          
            function isTyping(element) {
              if (!element) return false;
              var tag = element.tagName;
              return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || element.isContentEditable;
            }
          
            document.addEventListener('keydown', function (event) {
              var key = event.key;
              if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
              if (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown') {
                event.preventDefault();
                move(key === 'ArrowLeft' ? 'left' : key === 'ArrowRight' ? 'right' : key === 'ArrowUp' ? 'up' : 'down');
                return;
              }
              // The select button arrives as Enter on a TV remote.
              if (key === 'Enter') {
                var active = current();
                if (!active || isTyping(active)) return;
                var native = active.tagName === 'A' || active.tagName === 'BUTTON' || active.tagName === 'INPUT';
                if (!native && typeof active.click === 'function') {
                  event.preventDefault();
                  active.click();
                }
                return;
              }
              if (key === 'Escape' || key === 'GoBack' || key === 'BrowserBack' || key === 'Backspace') {
                if (key === 'Backspace' && isTyping(current())) return;
                if (window.history.length > 1) {
                  event.preventDefault();
                  window.history.back();
                }
              }
            }, true);
          
            function start() {
              installStyles();
              document.documentElement.setAttribute('data-myapps-tv', 'true');
              // Chrome only paints a focus ring after a key press; a remote-first app needs one straight away.
              window.setTimeout(function () {
                if (!current()) focusElement(focusable()[0]);
              }, 600);
            }
          
            if (document.readyState === 'complete') start();
            else window.addEventListener('load', start);
          })();
          MYAPPS_SCRIPT
          cat > /tmp/myapps-apply-tv.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const zlib = require('zlib');
          const path = require('path');
          const { execFileSync } = require('child_process');
          
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const WEB = 'wrapper/www';
          const MAIN = 'wrapper/android/app/src/main';
          const RES = path.join(MAIN, 'res/drawable-xhdpi');
          
          function crc32(buffer) {
            const table = [];
            for (let n = 0; n < 256; n++) {
              let c = n;
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
              table[n] = c >>> 0;
            }
            let crc = 0xffffffff;
            for (let i = 0; i < buffer.length; i++) crc = table[(crc ^ buffer[i]) & 0xff] ^ (crc >>> 8);
            return (crc ^ 0xffffffff) >>> 0;
          }
          
          function chunk(type, data) {
            const length = Buffer.alloc(4);
            length.writeUInt32BE(data.length, 0);
            const body = Buffer.concat([Buffer.from(type, 'ascii'), data]);
            const sum = Buffer.alloc(4);
            sum.writeUInt32BE(crc32(body), 0);
            return Buffer.concat([length, body, sum]);
          }
          
          // A plain banner keeps the launcher valid when no icon was uploaded.
          function solidBanner(width, height, hex) {
            const parts = String(hex || '#4F46E5').replace('#', '').match(/../g) || ['4F', '46', 'E5'];
            const rgb = parts.slice(0, 3).map((value) => parseInt(value, 16) || 0);
            const raw = Buffer.alloc((width * 3 + 1) * height);
            for (let y = 0; y < height; y++) {
              const row = y * (width * 3 + 1);
              for (let x = 0; x < width; x++) {
                const at = row + 1 + x * 3;
                raw[at] = rgb[0];
                raw[at + 1] = rgb[1];
                raw[at + 2] = rgb[2];
              }
            }
            const header = Buffer.alloc(13);
            header.writeUInt32BE(width, 0);
            header.writeUInt32BE(height, 4);
            header[8] = 8;
            header[9] = 2;
            return Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk('IHDR', header),
              chunk('IDAT', zlib.deflateSync(raw)),
              chunk('IEND', Buffer.alloc(0)),
            ]);
          }
          
          function writeBanner(target, logoUrl, themeColor) {
            if (logoUrl) {
              try {
                execFileSync('curl', ['-sSL', '--fail', logoUrl, '-o', '/tmp/myapps-tv-logo.png'], { stdio: 'inherit' });
                execFileSync(
                  'convert',
                  ['/tmp/myapps-tv-logo.png', '-background', 'none', '-gravity', 'center', '-resize', '320x180^', '-extent', '320x180', '-strip', 'PNG32:' + target],
                  { stdio: 'inherit' }
                );
                return 'logo';
              } catch (error) {
                console.log('::warning::The app icon could not be used for the TV banner - using a plain banner.');
              }
            }
            fs.writeFileSync(target, solidBanner(320, 180, themeColor));
            return 'solid';
          }
          
          // 1. Ship the remote navigation runtime with the bundled site.
          const runtime = fs.readFileSync('/tmp/myapps-tv-runtime.js', 'utf8');
          fs.mkdirSync(WEB, { recursive: true });
          fs.writeFileSync(path.join(WEB, 'myapps-tv.js'), runtime);
          const indexFile = path.join(WEB, 'index.html');
          if (!fs.existsSync(indexFile)) throw new Error('The bundled app has no index.html to add TV support to.');
          let html = fs.readFileSync(indexFile, 'utf8');
          if (!html.includes('myapps-tv.js')) {
            const tag = '<script src="myapps-tv.js" defer></script>';
            html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, tag + '\n</head>') : tag + '\n' + html;
            fs.writeFileSync(indexFile, html);
          }
          
          // 2. Leanback discovery and the TV launcher entry in the manifest.
          const manifestFile = path.join(MAIN, 'AndroidManifest.xml');
          let manifest = fs.readFileSync(manifestFile, 'utf8');
          if (!manifest.includes('android.software.leanback')) {
            const features = [
              '    <uses-feature android:name="android.software.leanback" android:required="false" />',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
            ].join('\n');
            const open = manifest.indexOf('<manifest');
            const close = manifest.indexOf('>', open);
            manifest = manifest.slice(0, close + 1) + '\n' + features + manifest.slice(close + 1);
          }
          if (!manifest.includes('android:banner')) {
            manifest = manifest.replace(/<application\b/, '<application\n        android:banner="@drawable/tv_banner"');
          }
          if (!manifest.includes('LEANBACK_LAUNCHER')) {
            const name = manifest.indexOf('MainActivity');
            if (name < 0) throw new Error('The generated Android project has no MainActivity.');
            const close = manifest.indexOf('</activity>', name);
            if (close < 0) throw new Error('The generated Android project has no activity block to extend.');
            const filter = [
              '',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN" />',
              '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
              '            </intent-filter>',
              '        ',
            ].join('\n');
            manifest = manifest.slice(0, close) + filter + manifest.slice(close);
          }
          fs.writeFileSync(manifestFile, manifest);
          
          // 3. A 320x180 launcher banner, which Android TV requires for discovery.
          fs.mkdirSync(RES, { recursive: true });
          const banner = writeBanner(path.join(RES, 'tv_banner.png'), String(config.logo_url || ''), String(config.theme_color || '#4F46E5'));
          console.log('MYAPPS_TV_MANIFEST_PATCHED ' + JSON.stringify({ banner, manifest: true, runtime: true }));
          MYAPPS_SCRIPT
          node /tmp/myapps-apply-tv.cjs
          (cd wrapper && npx cap copy android)
          cat > /tmp/myapps-verify-tv.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const manifest = fs.readFileSync('wrapper/android/app/src/main/AndroidManifest.xml', 'utf8');
          const assets = 'wrapper/android/app/src/main/assets/public';
          const html = fs.readFileSync(assets + '/index.html', 'utf8');
          const checks = {
            leanback: manifest.includes('android.software.leanback'),
            touchscreenOptional: /android.hardware.touchscreen"\s+android:required="false"/.test(manifest),
            bannerAttribute: /android:banner="@drawable\/tv_banner"/.test(manifest),
            leanbackLauncher: manifest.includes('LEANBACK_LAUNCHER'),
            banner: fs.existsSync('wrapper/android/app/src/main/res/drawable-xhdpi/tv_banner.png'),
            runtime: fs.existsSync(assets + '/myapps-tv.js'),
            entry: html.includes('myapps-tv.js'),
          };
          const failed = Object.keys(checks).filter((key) => !checks[key]);
          if (failed.length) {
            console.log('::error::The Android TV wrapper is incomplete: ' + failed.join(', '));
            process.exit(1);
          }
          console.log('MYAPPS_TV_WRAPPER_READY ' + JSON.stringify(checks));
          MYAPPS_SCRIPT
          node /tmp/myapps-verify-tv.cjs

      - name: Compile the APK
        working-directory: wrapper/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create "build-$BUILD_ID" app.apk --title "Build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "build-$BUILD_ID" app.apk --clobber
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/build-$BUILD_ID/app.apk" >> "$GITHUB_ENV"

      - name: Tell MyApps the build succeeded
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifact_url\":\"$APK_URL\"}"

      - name: Tell MyApps the build failed
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"message\":\"The compiler runner failed - open the Actions log for this run.\"}"

  ios:
    if: github.event.client_payload.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Set up Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '20'

      - name: Prepare the iOS wrapper
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p wrapper/www
          cat > /tmp/myapps-prepare-ios.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const p = JSON.parse(process.env.PAYLOAD || '{}');
          const c = p.app_config || {};
          fs.writeFileSync('wrapper/www/index.html', '<!doctype html><html><head><title>Loading</title></head><body>Loading</body></html>');
          fs.writeFileSync('wrapper/package.json', JSON.stringify({ name: 'myapps-ios-wrapper', private: true, devDependencies: { '@capacitor/cli': '^7.0.0' }, dependencies: { '@capacitor/core': '^7.0.0', '@capacitor/ios': '^7.0.0', '@capacitor/splash-screen': '^7.0.0' } }));
          fs.writeFileSync('wrapper/capacitor.config.json', JSON.stringify({ appId: p.package_name || c.package_name || 'com.myapps.app', appName: p.app_name || 'My App', webDir: 'www', server: { hostname: 'localhost', androidScheme: 'https', iosScheme: 'capacitor', cleartext: false } }));
          MYAPPS_SCRIPT
          node /tmp/myapps-prepare-ios.cjs
          (cd wrapper && npm install --no-audit --no-fund && npx cap add ios && npx cap sync ios)

      - name: Bundle the uploaded codebase for offline use
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "wrapper/www"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs wrapper/www
          cat > /tmp/myapps-sync-runtime.js <<'MYAPPS_SCRIPT'
          (function () {
            var cfg = window.__MYAPPS_SYNC__ || {};
            var QUEUE_KEY = 'myapps.sync.queue';
            var CLIENT_KEY = 'myapps.sync.client';
            var MAX_ITEMS = 200;
            var MAX_ATTEMPTS = 5;
            var status = 'idle';
            var lastError = '';
            var busy = false;
            var chip = null;
            var hideTimer = null;

            function readQueue() {
              try {
                var raw = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
              } catch (error) {
                return [];
              }
            }

            function saveQueue(items) {
              try {
                localStorage.setItem(QUEUE_KEY, JSON.stringify(items.slice(-MAX_ITEMS)));
              } catch (error) {}
            }

            function clientId() {
              var existing = '';
              try {
                existing = localStorage.getItem(CLIENT_KEY) || '';
                if (!existing) {
                  existing = 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
                  localStorage.setItem(CLIENT_KEY, existing);
                }
              } catch (error) {
                existing = 'c-anonymous';
              }
              return existing;
            }

            function online() {
              return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
            }

            function newId() {
              return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            function announce() {
              try {
                window.dispatchEvent(
                  new CustomEvent('myapps:sync', {
                    detail: { status: status, pending: readQueue().length, error: lastError, enabled: !!cfg.endpoint },
                  })
                );
              } catch (error) {}
            }

            function label(state, pending) {
              if (!cfg.endpoint) return state === 'offline' ? 'Offline - bundled app' : '';
              if (state === 'offline') return pending ? 'Offline - ' + pending + ' waiting to sync' : 'Offline - changes saved on this device';
              if (state === 'syncing') return 'Syncing ' + pending + ' change' + (pending === 1 ? '' : 's') + '...';
              if (state === 'pending') return pending + ' change' + (pending === 1 ? '' : 's') + ' waiting to sync';
              if (state === 'synced') return 'All changes synced';
              if (state === 'failed') return 'Sync failed - tap to retry';
              return '';
            }

            function ensureChip() {
              if (chip || !document.body) return chip;
              chip = document.createElement('div');
              chip.id = 'myapps-sync-chip';
              chip.setAttribute('role', 'status');
              chip.setAttribute('aria-live', 'polite');
              chip.style.cssText = [
                'position:fixed', 'left:50%', 'transform:translateX(-50%)',
                'bottom:calc(14px + env(safe-area-inset-bottom,0px))',
                'z-index:2147483000', 'max-width:calc(100vw - 28px)',
                'padding:7px 13px', 'border-radius:999px',
                'font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
                'background:rgba(17,24,39,0.92)', 'color:#fff', 'box-shadow:0 8px 22px -10px rgba(0,0,0,0.6)',
                'opacity:0', 'transition:opacity 180ms ease', 'pointer-events:none', 'text-align:center',
              ].join(';');
              chip.addEventListener('click', function () {
                if (cfg.endpoint) flush();
              });
              document.body.appendChild(chip);
              return chip;
            }

            function render() {
              var pending = readQueue().length;
              if (!cfg.showStatus) return;
              var text = label(status, pending);
              var node = ensureChip();
              if (!node) return;
              if (!text) {
                node.style.opacity = '0';
                node.style.pointerEvents = 'none';
                return;
              }
              node.textContent = text;
              node.style.opacity = '1';
              node.style.pointerEvents = status === 'failed' ? 'auto' : 'none';
              node.style.cursor = status === 'failed' ? 'pointer' : 'default';
              node.style.background = status === 'failed' ? 'rgba(185,28,28,0.94)' : 'rgba(17,24,39,0.92)';
              if (hideTimer) clearTimeout(hideTimer);
              if (status === 'synced') {
                hideTimer = setTimeout(function () {
                  if (chip) chip.style.opacity = '0';
                }, 3000);
              }
            }

            function drop(ids) {
              var remove = {};
              ids.forEach(function (id) {
                remove[id] = true;
              });
              var kept = readQueue().filter(function (item) {
                return !remove[item.id];
              });
              saveQueue(kept);
              return kept;
            }

            function markAttempts(ids) {
              var flagged = {};
              ids.forEach(function (id) {
                flagged[id] = true;
              });
              saveQueue(
                readQueue().map(function (item) {
                  if (!flagged[item.id]) return item;
                  return Object.assign({}, item, { attempts: (item.attempts || 0) + 1 });
                })
              );
            }

            function flush() {
              var queue = readQueue();
              if (!cfg.endpoint || busy || !online() || queue.length === 0) {
                if (queue.length && !online()) {
                  status = 'offline';
                  render();
                  announce();
                }
                return Promise.resolve(false);
              }

              busy = true;
              status = 'syncing';
              lastError = '';
              render();
              announce();

              var controller = typeof AbortController === 'function' ? new AbortController() : null;
              var timeout = controller ? setTimeout(function () { controller.abort(); }, 15000) : null;

              return fetch(cfg.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller ? controller.signal : undefined,
                body: JSON.stringify({ client: clientId(), app: cfg.appName || '', operations: queue }),
              })
                .then(function (response) {
                  if (!response.ok) throw new Error('The sync service answered ' + response.status + '.');
                  return response.json().catch(function () { return {}; });
                })
                .then(function (result) {
                  var acked = Array.isArray(result && result.acknowledged) ? result.acknowledged : queue.map(function (item) { return item.id; });
                  var conflicts = Array.isArray(result && result.conflicts) ? result.conflicts : [];
                  var rejected = Array.isArray(result && result.rejected) ? result.rejected : [];
                  var kept = drop(acked.filter(function (id) { return conflicts.indexOf(id) === -1; }));
                  if (conflicts.length || rejected.length) markAttempts(conflicts.concat(rejected));
                  lastError = conflicts.length ? 'The service reported conflicting changes that were kept on this device.' : '';
                  status = kept.length ? 'failed' : 'synced';
                  return pull(kept.length);
                })
                .catch(function (error) {
                  lastError = String((error && error.message) || 'The sync service could not be reached.');
                  status = 'failed';
                  announce();
                  return false;
                })
                .then(function (result) {
                  busy = false;
                  if (timeout) clearTimeout(timeout);
                  render();
                  announce();
                  return result;
                });
            }

            function pull(keptPending) {
              if (!cfg.pullPath) return keptPending;
              return fetch(cfg.endpoint.replace(/\/+$/, '') + cfg.pullPath, { headers: { Accept: 'application/json' } })
                .then(function (response) {
                  return response.ok ? response.json() : null;
                })
                .then(function (data) {
                  if (data) {
                    try {
                      window.dispatchEvent(new CustomEvent('myapps:sync:data', { detail: data }));
                    } catch (error) {}
                  }
                  return keptPending;
                })
                .catch(function () {
                  return keptPending;
                });
            }

            function refresh() {
              if (!online()) {
                status = 'offline';
                render();
                announce();
                return;
              }
              if (!cfg.endpoint) {
                status = 'idle';
                render();
                announce();
                return;
              }
              if (readQueue().length === 0) {
                status = 'idle';
                render();
                announce();
                return;
              }
              flush();
            }

            window.MyApps = window.MyApps || {};
            window.MyApps.sync = {
              enabled: function () { return !!cfg.endpoint; },
              pending: function () { return readQueue().length; },
              status: function () { return status; },
              flush: flush,
              push: function (operation) {
                var op = operation || {};
                var queue = readQueue();
                var item = {
                  id: op.id ? String(op.id) : newId(),
                  path: String(op.path || '/'),
                  method: String(op.method || 'POST').toUpperCase(),
                  body: op.body === undefined ? null : op.body,
                  at: new Date().toISOString(),
                  attempts: 0,
                };
                queue.push(item);
                saveQueue(queue);
                status = online() ? 'pending' : 'offline';
                render();
                announce();
                flush();
                return item.id;
              },
              clear: function () {
                saveQueue([]);
                lastError = '';
                status = online() ? 'idle' : 'offline';
                render();
                announce();
              },
            };

            window.addEventListener('online', refresh);
            window.addEventListener('offline', function () {
              status = 'offline';
              render();
              announce();
            });
            document.addEventListener('visibilitychange', function () {
              if (!document.hidden && online() && cfg.endpoint && readQueue().length) flush();
            });
            setInterval(function () {
              if (cfg.endpoint && online() && readQueue().length && status !== 'syncing') flush();
            }, 45000);
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', refresh);
            } else {
              refresh();
            }
          })();
          MYAPPS_SCRIPT
          cat > /tmp/myapps-inject-sync.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.sync_endpoint || '').trim();
          const endpoint = /^https:\/\/\S{8,500}$/i.test(raw) ? raw : '';
          const pullPath = /^\/[\w\-./?=&\u0025]{1,120}$/.test(String(config.sync_pull_path || '')) ? String(config.sync_pull_path) : '';
          const entry = path.join(root, 'index.html');

          if (!fs.existsSync(entry)) {
            console.error('::error::The bundled site has no index.html.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (/^\s*-\s+name:\s/m.test(html) || html.indexOf('MYAPPS_SCRIPT') !== -1) {
            console.error('::error::The archive produced build instructions instead of a website. Upload the built site (its dist folder), not the repository root.');
            process.exit(1);
          }
          if (!/<html/i.test(html) || !/<body/i.test(html) || !/<head/i.test(html)) {
            console.error('::error::index.html is not a browser page. Upload a build whose index.html opens in a browser.');
            process.exit(1);
          }

          const titleMatch = html.match(/<title[^>]*>([^<]{0,120})<\/title>/i);
          const title = titleMatch ? titleMatch[1].trim() : '';

          fs.writeFileSync(path.join(root, 'myapps-sync.js'), fs.readFileSync('/tmp/myapps-sync-runtime.js', 'utf8'));
          const bag = {
            endpoint: endpoint,
            pullPath: pullPath,
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            showStatus: true,
          };
          const injected = '<script>window.__MYAPPS_SYNC__=' + JSON.stringify(bag).replace(/</g, '\u003c') + ';</script>' +
            '<script src="/myapps-sync.js" defer></script>';

          if (html.indexOf('myapps-sync.js') === -1) {
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => injected + '</body>') : html + injected;
            fs.writeFileSync(entry, html);
          }

          const assets = (html.match(/<(?:script|link)\b[^>]*\b(?:src|href)\s*=/gi) || []).length;
          console.log('MYAPPS_APP_ENTRYPOINT ' + JSON.stringify({
            title: title.slice(0, 80),
            assets: assets,
            offline: true,
            sync: !!endpoint,
          }));
          MYAPPS_SCRIPT
          node /tmp/myapps-inject-sync.cjs wrapper/www
          cat > /tmp/myapps-configure-mobile.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const file = 'wrapper/capacitor.config.json';
          if (!fs.existsSync(file)) throw new Error('The Capacitor JSON configuration is missing.');
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.webDir = 'www';
          config.server = { hostname: 'localhost', androidScheme: 'https', iosScheme: 'capacitor', cleartext: false };
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          console.log('MYAPPS_LOCAL_ORIGIN_CONFIGURED https://localhost capacitor://localhost webDir=www');
          MYAPPS_SCRIPT
          node /tmp/myapps-configure-mobile.cjs
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD).platform||"android"')
          (cd wrapper && npx cap copy "$PLATFORM")

      - name: Verify the local bundle server
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          cat > /tmp/myapps-verify-mobile.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const assert = require('assert/strict');
          const platform = process.argv[2];
          const android = platform === 'android';
          const nativeRoot = android ? 'wrapper/android/app/src/main/assets' : 'wrapper/ios/App/App';
          const config = JSON.parse(fs.readFileSync(nativeRoot + '/capacitor.config.json', 'utf8'));
          assert.equal(config.webDir, 'www');
          assert.equal(config.server.hostname, 'localhost');
          assert.equal(config.server.androidScheme, 'https');
          assert.equal(config.server.iosScheme, 'capacitor');
          assert.ok(!config.server.url, 'A remote URL overrides the embedded asset server.');
          const bundle = path.resolve('wrapper/www');
          const nativeBundle = path.resolve(nativeRoot, 'public');
          let checked = 0;
          function verify(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const source = path.join(dir, entry.name);
              if (entry.isDirectory()) { verify(source); continue; }
              const copied = path.join(nativeBundle, path.relative(bundle, source));
              const hash = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              assert.equal(hash(copied), hash(source), 'Native asset mismatch: ' + source);
              checked++;
            }
          }
          verify(bundle);
          const shippedHtml = fs.readFileSync(path.join(nativeBundle, 'index.html'), 'utf8');
          assert.match(shippedHtml, /<base href="\/">/);
          // The shipped page must be the app itself, with the offline sync runtime in it.
          assert.ok(!/^\s*-\s+name:\s/m.test(shippedHtml), 'The shipped index.html holds compiler instructions instead of the app.');
          assert.ok(!/MYAPPS_SCRIPT/.test(shippedHtml), 'The shipped index.html holds compiler instructions instead of the app.');
          assert.match(shippedHtml, /myapps-sync\.js/, 'The offline sync runtime is missing from the shipped app.');
          // Verify the generated app, not private Capacitor source formatting. Constructor
          // arguments and native source paths can change without changing server behavior.
          console.log('MYAPPS_LOCAL_ORIGIN_VERIFIED ' + JSON.stringify({ platform, origin: android ? 'https://localhost/' : 'capacitor://localhost/', level: 'configuration', checked, nativeAssets: true, entry: true, syncRuntime: true }));
          MYAPPS_SCRIPT
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD).platform||"android"')
          node /tmp/myapps-verify-mobile.cjs "$PLATFORM"

      - name: Report that iOS signing is not configured
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"message\":\"iOS builds need an Apple Developer certificate and a macOS runner. Add signing to the template repo, then build again.\"}"
