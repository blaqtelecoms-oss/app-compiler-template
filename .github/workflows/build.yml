          cat > /tmp/myapps-apply-tv.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const zlib = require('zlib');
          const path = require('path');
          const { execFileSync } = require('child_process');
          
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
