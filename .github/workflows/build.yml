name: Build mobile app

on:
  repository_dispatch:
    types: [myapps-build, build_app]

permissions:
  contents: write

jobs:
  android:
    if: github.event.client_payload.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create the native wrapper
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p wrapper/www
          cat > wrapper/www/index.html <<'HTML'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Loading</title></head>
            <body style="margin:0;background:#ffffff;color:#111827;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif">
              <p>Loading&hellip;</p>
            </body>
          </html>
          HTML
          node -e '
            const fs = require("fs");
            const p = JSON.parse(process.env.PAYLOAD || "{}");
            const slug = String(p.app_name || "myapp").toLowerCase().replace(/[^a-z0-9]+/g, "") || "app";
            const appId = p.package_name || ("com.myapps." + slug);
            fs.writeFileSync("wrapper/package.json", JSON.stringify({
              name: "myapps-wrapper",
              private: true,
              devDependencies: { "@capacitor/cli": "^7.0.0" },
              dependencies: {
                "@capacitor/core": "^7.0.0",
                "@capacitor/android": "^7.0.0",
                "@capacitor/splash-screen": "^7.0.0"
              }
            }, null, 2));
            fs.writeFileSync("wrapper/capacitor.config.json", JSON.stringify({
              appId: appId,
              appName: p.app_name || "My App",
              webDir: "www",
              // This window sits behind the WebView while the remote site loads.
              // Keeping it neutral stops the theme colour flashing after the splash.
              backgroundColor: "#FFFFFF",
              server: { url: p.website_url, cleartext: false },
              android: { backgroundColor: "#FFFFFF" },
              plugins: {
                SplashScreen: {
                  launchShowDuration: 1200,
                  launchAutoHide: true,
                  // Keep every native surface neutral; the splash artwork covers this.
                  backgroundColor: "#FFFFFF",
                  androidSplashResourceName: "splash",
                  androidScaleType: "CENTER_CROP",
                  showSpinner: false,
                  splashFullScreen: true,
                  splashImmersive: false
                }
              }
            }, null, 2));
          '

      - name: Generate the Android project
        working-directory: wrapper
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      # Each app ships its own icon and splash screen. Both are public uploads
      # from the project, so they can be fetched straight into the native assets.
      - name: Keep the same signing key for updates
        working-directory: wrapper
        run: |
          mkdir -p "$HOME/.android" keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -keystore keystore/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git add -f keystore/debug.keystore
            git -c user.name=myapps-bot -c user.email=builds@myapps.local commit -m "Store the app signing key so updates install over each other" >/dev/null || true
            git push origin "HEAD:${{ github.event.repository.default_branch }}" || echo "::warning::Could not store the signing key in the repository."
          fi
          cp keystore/debug.keystore "$HOME/.android/debug.keystore"
          echo "Signing key ready - updates install over the previous build."
      - name: Stamp the app version
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          VERSION_NAME=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.version_name||"1.0.0"')
          VERSION_CODE=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.version_code||1')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/; s/versionCode [0-9]+/versionCode $VERSION_CODE/" wrapper/android/app/build.gradle
          echo "Stamped version $VERSION_NAME (build $VERSION_CODE)"
          grep -E "versionName|versionCode" wrapper/android/app/build.gradle
      - name: Apply the app icon and splash screen
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          APP_ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          APP_SPLASH_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.splash_screen_url||""')

          if [ -z "$APP_ICON_URL" ] && [ -z "$APP_SPLASH_URL" ]; then
            echo "This app has no uploaded icon or splash screen - keeping the template artwork."
            exit 0
          fi

          command -v convert >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y imagemagick; }
          RES=wrapper/android/app/src/main/res

          if [ -n "$APP_ICON_URL" ]; then
            if curl -sSL --fail "$APP_ICON_URL" -o /tmp/app-icon.png; then
              echo "Applying the uploaded app icon"
              # An adaptive icon would keep the template foreground, so plain PNGs are used.
              rm -rf "$RES/mipmap-anydpi-v26"
              for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
                density=${pair%%:*}
                size=${pair##*:}
                mkdir -p "$RES/mipmap-$density"
                convert /tmp/app-icon.png -background none -gravity center \
                  -resize "${size}x${size}^" -extent "${size}x${size}" -strip \
                  "PNG32:$RES/mipmap-$density/ic_launcher.png"
                cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
              done
            else
              echo "::warning::The app icon could not be downloaded - keeping the template icon."
            fi
          fi

          if [ -n "$APP_SPLASH_URL" ]; then
            if curl -sSL --fail "$APP_SPLASH_URL" -o /tmp/app-splash.png; then
              echo "Applying the uploaded splash screen"
              splash() {
                mkdir -p "$RES/$1"
                convert /tmp/app-splash.png -gravity center -resize "$2x$3^" -extent "$2x$3" -strip \
                  "PNG32:$RES/$1/splash.png"
              }
              splash drawable 1080 1920
              splash drawable-port-mdpi 320 480
              splash drawable-port-hdpi 480 800
              splash drawable-port-xhdpi 720 1280
              splash drawable-port-xxhdpi 960 1600
              splash drawable-port-xxxhdpi 1280 1920
              splash drawable-land-mdpi 480 320
              splash drawable-land-hdpi 800 480
              splash drawable-land-xhdpi 1280 720
              splash drawable-land-xxhdpi 1600 960
              splash drawable-land-xxxhdpi 1920 1280
            else
              echo "::warning::The splash screen could not be downloaded - keeping the template splash."
            fi
          fi

      - name: Bundle the uploaded codebase for offline use
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              (
                cd "$project"
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::warning::The project built, but no site output was found - using the files as uploaded."
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            # Root-absolute paths (src="/assets/app.js") only resolve on a web
            # server, so they become relative and load from inside the app.
            node -e "const fs=require('fs'),f=process.argv[1];let s=fs.readFileSync(f,'utf8');s=s.replace(/((?:src|href|poster)=[\"'])\/(?!\/)/g,'\$1');fs.writeFileSync(f,s)" "$dest/index.html"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "wrapper/www"
          node -e 'const fs=require("fs");const p="wrapper/capacitor.config.json";if(fs.existsSync(p)){const c=JSON.parse(fs.readFileSync(p,"utf8"));delete c.server;fs.writeFileSync(p,JSON.stringify(c,null,2));}'
          (cd wrapper && npx cap copy android)
          echo "The app ships its own files, so it runs without a connection."
      - name: Compile the APK
        working-directory: wrapper/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create "build-$BUILD_ID" app.apk --title "Build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "build-$BUILD_ID" app.apk --clobber
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/build-$BUILD_ID/app.apk" >> "$GITHUB_ENV"

      - name: Tell MyApps the build succeeded
        if: success()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifact_url\":\"$APK_URL\"}"

      - name: Tell MyApps the build failed
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"message\":\"The compiler runner failed - open the Actions log for this run.\"}"

  ios:
    if: github.event.client_payload.platform == 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Report that iOS signing is not configured
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"message\":\"iOS builds need an Apple Developer certificate and a macOS runner. Add signing to the template repo, then build again.\"}"
