        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"failed\",\"message\":\"The desktop compiler stopped - open the Actions log for this run.\"}"

  linux:
    if: github.event.client_payload.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create the desktop shell
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p desktop/app
          APP_NAME=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); (p.app_name||"Desktop App").slice(0,60)')
          TARGET_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); p.target_url||""')
          SLUG=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); String(p.app_name||"app").toLowerCase().replace(/[^a-z0-9]+/g,"")||"app"')
          cat > desktop/config.json <<JSON
          {
            "targetUrl": "$TARGET_URL",
            "appName": "$APP_NAME"
          }
          JSON
          cat > desktop/main.js <<'JS'
          const { app, BrowserWindow, shell } = require('electron');
          const path = require('path');
          const config = require('./config.json');
          const origin = config.targetUrl ? new URL(config.targetUrl).origin : '';

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 820,
              minWidth: 760,
              minHeight: 540,
              title: config.appName,
              autoHideMenuBar: true,
              backgroundColor: '#ffffff',
              webPreferences: { contextIsolation: true, nodeIntegration: false },
            });
            if (config.targetUrl) {
              win.loadURL(config.targetUrl);
              win.webContents.on('will-navigate', (event, url) => {
                if (!url.startsWith(origin)) {
                  event.preventDefault();
                  shell.openExternal(url);
                }
              });
            } else {
              // Codebase build: the site's files are shipped inside the app.
              win.loadFile(path.join(__dirname, 'app', 'index.html'));
            }
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          JS
          cat > desktop/package.json <<JSON
          {
            "name": "$SLUG",
            "productName": "$APP_NAME",
            "version": "1.0.0",
            "main": "main.js",
            "author": "MyApps Convertor",
            "description": "$APP_NAME",
            "files": ["main.js", "config.json", "app/**/*"],
            "build": {
              "appId": "com.myapps.$SLUG",
              "productName": "$APP_NAME",
              "directories": { "output": "dist" },
              "win": { "target": "nsis" },
              "mac": { "target": "dmg", "category": "public.app-category.productivity" },
              "linux": { "target": "AppImage", "category": "Utility" }
            },
            "devDependencies": { "electron": "^33.0.0", "electron-builder": "^25.0.0" }
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync("desktop/package.json","utf8"))'
          echo "Desktop shell ready for $APP_NAME"

      - name: Unpack the uploaded codebase
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              (
                cd "$project"
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::warning::The project built, but no site output was found - using the files as uploaded."
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            # Root-absolute paths (src="/assets/app.js") only resolve on a web
            # server, so they become relative and load from inside the app.
            node -e "const fs=require('fs'),f=process.argv[1];let s=fs.readFileSync(f,'utf8');s=s.replace(/((?:src|href|poster)=[\"'])\/(?!\/)/g,'\$1');fs.writeFileSync(f,s)" "$dest/index.html"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "desktop/app"
          echo "The installers ship the app files, so they run without a connection."

      # Installers carry the app's own artwork. electron-builder converts the
      # square PNG into the format each operating system needs.
      - name: Apply the app icon
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          if [ -z "$ICON_URL" ]; then
            echo "No app icon was uploaded - using the default artwork."
            exit 0
          fi
          if curl -sSL --fail "$ICON_URL" -o desktop/icon.png; then
            node -e 'const fs=require("fs");const p="desktop/package.json";const pkg=JSON.parse(fs.readFileSync(p,"utf8"));pkg.build.icon="icon.png";fs.writeFileSync(p,JSON.stringify(pkg,null,2));'
            echo "Applied the uploaded app icon"
          else
            echo "::warning::The app icon could not be downloaded - using the default artwork."
          fi

      - name: Package the installer
        shell: bash
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage --publish never

      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          TAG=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").release_tag')
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          FILE=""
          for candidate in desktop/dist/*.AppImage; do
            [ -f "$candidate" ] || continue
            case "$candidate" in *.blockmap) continue ;; esac
            FILE="$candidate"
            break
          done
          if [ -z "$FILE" ]; then
            echo "::error::The installer was not produced by the packaging step."
            ls -1 desktop/dist || true
            exit 1
          fi
          gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" --title "Desktop build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          # GitHub rewrites characters it does not keep in an asset name (spaces
          # become dots), so the link is read back from the published release
          # instead of being guessed from the local file name.
          ASSET_JQ='[.assets[] | select(.name | ascii_downcase | endswith(".AppImage"))][0]'
          FILE_NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.name")
          ARTIFACT_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.browser_download_url")
          if [ -z "$FILE_NAME" ] || [ -z "$ARTIFACT_URL" ]; then
            echo "::warning::The published installer could not be read back - using the local file name."
            FILE_NAME=$(basename "$FILE" | tr ' ' '.')
            ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE_NAME"
          fi
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "Published $FILE_NAME"

      - name: Tell MyApps the build succeeded
        if: success()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"success\",\"artifact_url\":\"$ARTIFACT_URL\",\"file_name\":\"$FILE_NAME\"}"

      - name: Tell MyApps the build failed
        if: failure()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"failed\",\"message\":\"The desktop compiler stopped - open the Actions log for this run.\"}"
