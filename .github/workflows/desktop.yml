name: Build desktop app
run-name: "MyApps ${{ github.event.client_payload.build_id }} (${{ github.event.client_payload.platform }})"

on:
  repository_dispatch:
    types: [build_desktop_app]

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    if: github.event.client_payload.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create the desktop shell
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p desktop/app
          APP_NAME=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); (p.app_name||"Desktop App").slice(0,60)')
          TARGET_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); p.build_type==="zip"?"":p.target_url||""')
          SLUG=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); String(p.app_name||"app").toLowerCase().replace(/[^a-z0-9]+/g,"")||"app"')
          cat > desktop/config.json <<JSON
          {
            "targetUrl": "$TARGET_URL",
            "appName": "$APP_NAME"
          }
          JSON
          cat > desktop/local-origin.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { net } = require('electron');
          const SCHEME = 'myapps';
          const ORIGIN = SCHEME + '://localhost/';
          const privileges = { standard: true, secure: true, supportFetchAPI: true, corsEnabled: true, stream: true };
          function installLocalOrigin(localSession, directory) {
            const root = fs.realpathSync(directory);
            const inside = (file) => file === root || file.startsWith(root + path.sep);
            localSession.protocol.handle(SCHEME, async (request) => {
              const url = new URL(request.url);
              if (url.host !== 'localhost') return new Response('Forbidden', { status: 403 });
              if (!['GET', 'HEAD'].includes(request.method)) return new Response('Method not allowed', { status: 405 });
              let pathname;
              try { pathname = decodeURIComponent(url.pathname); } catch { return new Response('Bad path', { status: 400 }); }
              if (pathname.includes('\\') || pathname.includes('\0')) return new Response('Bad path', { status: 400 });
              let file = path.resolve(root, '.' + pathname);
              if (!inside(file)) return new Response('Forbidden', { status: 403 });
              if (fs.existsSync(file) && fs.statSync(file).isDirectory()) file = path.join(file, 'index.html');
              if (!fs.existsSync(file)) {
                // Only documents get SPA fallback; missing JS/CSS must remain a real 404.
                const documentRequest = request.mode === 'navigate' || (request.headers.get('accept') || '').includes('text/html');
                if (!documentRequest || path.extname(pathname)) return new Response('Not found', { status: 404 });
                file = path.join(root, 'index.html');
              }
              if (!inside(fs.realpathSync(file)) || !fs.statSync(file).isFile()) return new Response('Forbidden', { status: 403 });
              const response = await net.fetch(pathToFileURL(file).href);
              const headers = new Headers(response.headers);
              headers.set('X-Content-Type-Options', 'nosniff');
              headers.set('Cache-Control', 'no-cache');
              return new Response(request.method === 'HEAD' ? null : response.body, { status: response.status, headers });
            });
          }
          module.exports = { SCHEME, ORIGIN, privileges, installLocalOrigin };
          MYAPPS_SCRIPT
          cat > desktop/verify-bundle.cjs <<'MYAPPS_SCRIPT'
          module.exports = async function verifyBundle(win, localSession, origin) {
            const assert = require('assert/strict');
            const html = await localSession.fetch(origin);
            assert.equal(html.status, 200);
            assert.match(html.headers.get('content-type') || '', /text\/html/);
            const index = await html.text();
            const deep = await localSession.fetch(origin + '__myapps_probe__/route', { headers: { Accept: 'text/html' } });
            assert.equal(deep.status, 200);
            assert.equal(await deep.text(), index, 'SPA document fallback differs from index.html');
            assert.equal((await localSession.fetch(origin + '__myapps_missing__.js')).status, 404);
            let checked = 0;
            for (const tag of index.match(/<(?:script|link)\b[^>]*>/gi) || []) {
              if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload)["']/i.test(tag)) continue;
              const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
              if (!match) continue;
              const url = new URL(match[1], origin);
              if (url.protocol !== 'myapps:') continue;
              const response = await localSession.fetch(url.href);
              assert.equal(response.status, 200, 'Entry asset missing: ' + url.href);
              assert.doesNotMatch(response.headers.get('content-type') || '', /text\/html/);
              checked++;
            }
            await win.loadURL(origin);
            const waitForContent = async () => {
              for (let attempt = 0; attempt < 60; attempt++) {
                const rendered = await win.webContents.executeJavaScript(
                  '(() => { const b=document.body.cloneNode(true); b.querySelectorAll("script,style,noscript").forEach(n=>n.remove()); return !!(b.textContent.trim() || b.querySelector("img,svg,canvas,video,iframe,input,button")); })()'
                );
                if (rendered) return;
                await new Promise((resolve) => setTimeout(resolve, 250));
              }
              throw new Error('The bundled app rendered an empty document after 15 seconds.');
            };
            await waitForContent();
            await win.webContents.executeJavaScript('history.pushState({}, "", "/__myapps_probe__/route")');
            await Promise.race([
              new Promise((resolve, reject) => {
                win.webContents.once('did-finish-load', resolve);
                win.webContents.once('did-fail-load', (_event, code, message) => reject(new Error(code + ': ' + message)));
                win.webContents.reload();
              }),
              new Promise((_, reject) => setTimeout(() => reject(new Error('SPA reload timed out.')), 20000)),
            ]);
            await waitForContent();
            assert.equal(new URL(win.webContents.getURL()).pathname, '/__myapps_probe__/route');
            console.log('MYAPPS_LOCAL_ORIGIN_VERIFIED ' + JSON.stringify({ origin, platform: process.platform, level: 'renderer', checked, spaFallback: true, historyReload: true }));
          };
          MYAPPS_SCRIPT
          cat > desktop/main.js <<'JS'
          const { app, BrowserWindow, shell, protocol, session } = require('electron');
          const fs = require('fs');
          const path = require('path');
          const config = require('./config.json');
          const local = require('./local-origin.cjs');
          const verifying = process.argv.includes('--verify-local-bundle');
          protocol.registerSchemesAsPrivileged([{ scheme: local.SCHEME, privileges: local.privileges }]);
          const startUrl = config.targetUrl || local.ORIGIN;
          const sameOrigin = (url) => {
            try { const a = new URL(startUrl), b = new URL(url); return a.protocol === b.protocol && a.host === b.host; }
            catch { return false; }
          };
          let localSession;
          let splash;
          // A splash window is shown only when the build shipped splash artwork.
          function showSplash() {
            if (verifying) return;
            if (!fs.existsSync(path.join(__dirname, 'splash.png'))) return;
            splash = new BrowserWindow({
              width: 600, height: 400, frame: false, resizable: false, backgroundColor: '#ffffff',
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            splash.loadFile(path.join(__dirname, 'splash.html'));
          }
          function closeSplash() {
            if (!splash) return;
            if (!splash.isDestroyed()) splash.destroy();
            splash = null;
          }
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200, height: 820, minWidth: 760, minHeight: 540,
              title: config.appName, autoHideMenuBar: true, backgroundColor: '#ffffff',
              show: false,
              webPreferences: { session: localSession, contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            win.webContents.on('will-navigate', (event, url) => {
              if (!sameOrigin(url)) {
                event.preventDefault();
                if (/^https?:/i.test(url)) shell.openExternal(url);
              }
            });
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.once('ready-to-show', () => {
              closeSplash();
              if (!verifying) win.show();
            });
            return win;
          }
          app.whenReady().then(async () => {
            localSession = session.fromPartition(verifying ? 'myapps-verification' : 'persist:myapps');
            if (!config.targetUrl) {
              local.installLocalOrigin(localSession, path.join(__dirname, 'app'));
              console.log('MYAPPS_LOCAL_ORIGIN_CONFIGURED ' + local.ORIGIN);
            }
            showSplash();
            const win = createWindow();
            if (verifying) {
              await require('./verify-bundle.cjs')(win, localSession, local.ORIGIN);
              app.exit(0);
            } else await win.loadURL(startUrl);
          }).catch((error) => { console.error(error); app.exit(1); });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          app.on('activate', () => {
            if (localSession && BrowserWindow.getAllWindows().length === 0) createWindow().loadURL(startUrl);
          });
          JS
          cat > desktop/splash.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <style>
                html, body { margin: 0; height: 100%; background: #ffffff; }
                body { display: flex; align-items: center; justify-content: center; }
                img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
              </style>
            </head>
            <body><img src="splash.png" alt="" /></body>
          </html>
          HTML
          cat > desktop/package.json <<JSON
          {
            "name": "$SLUG",
            "productName": "$APP_NAME",
            "version": "1.0.0",
            "main": "main.js",
            "author": "MyApps Convertor",
            "description": "$APP_NAME",
            "build": {
              "files": ["main.js", "local-origin.cjs", "verify-bundle.cjs", "config.json", "splash.html", "splash.*", "app/**/*"],
              "appId": "com.myapps.$SLUG",
              "productName": "$APP_NAME",
              "directories": { "output": "dist" },
              "win": { "target": "nsis" },
              "mac": { "target": "dmg", "category": "public.app-category.productivity" },
              "linux": { "target": "AppImage", "category": "Utility" }
            },
            "devDependencies": { "electron": "^33.0.0", "electron-builder": "^25.0.0" }
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync("desktop/package.json","utf8"))'
          echo "Desktop shell ready for $APP_NAME"

      - name: Unpack the uploaded codebase
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "desktop/app"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs desktop/app
          echo "The installers ship the app files, so they run without a connection."

      # Installers carry the app's own artwork. electron-builder converts the
      # square PNG into the format each operating system needs.
      - name: Apply the app icon
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          if [ -z "$ICON_URL" ]; then
            echo "No app icon was uploaded - using the default artwork."
            exit 0
          fi
          if curl -sSL --fail "$ICON_URL" -o desktop/icon.png; then
            node -e 'const fs=require("fs");const p="desktop/package.json";const pkg=JSON.parse(fs.readFileSync(p,"utf8"));pkg.build.icon="icon.png";fs.writeFileSync(p,JSON.stringify(pkg,null,2));'
            echo "Applied the uploaded app icon"
          else
            echo "::warning::The app icon could not be downloaded - using the default artwork."
          fi

      # A splash screen is applied where the desktop runtime shows one: the
      # Electron shell paints it while the main window loads.
      - name: Apply the splash screen
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          SPLASH_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.splash_screen_url||""')
          if [ -z "$SPLASH_URL" ]; then
            echo "No splash screen was uploaded - the app opens straight into its window."
            exit 0
          fi
          if curl -sSL --fail "$SPLASH_URL" -o desktop/splash.png; then
            echo "Applied the uploaded splash screen"
          else
            echo "::warning::The splash screen could not be downloaded - the app starts without one."
          fi

      - name: Install desktop tools
        shell: bash
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify the local bundle server
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # This flag is confined to the disposable hosted runner probe.
            # Installed apps retain Chromium's sandbox and normal web security.
            xvfb-run -a npx electron . --no-sandbox --verify-local-bundle
          else
            npx electron . --verify-local-bundle
          fi

      - name: Package the installer
        shell: bash
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          TAG=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").release_tag')
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          FILE=""
          for candidate in desktop/dist/*.exe; do
            [ -f "$candidate" ] || continue
            case "$candidate" in *.blockmap) continue ;; esac
            FILE="$candidate"
            break
          done
          if [ -z "$FILE" ]; then
            echo "::error::The installer was not produced by the packaging step."
            ls -1 desktop/dist || true
            exit 1
          fi
          gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" --title "Desktop build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          # GitHub rewrites characters it does not keep in an asset name (spaces
          # become dots), so the link is read back from the published release
          # instead of being guessed from the local file name.
          ASSET_JQ='[.assets[] | select(.name | ascii_downcase | endswith(".exe"))][0]'
          FILE_NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.name")
          ARTIFACT_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.browser_download_url")
          if [ -z "$FILE_NAME" ] || [ -z "$ARTIFACT_URL" ]; then
            echo "::warning::The published installer could not be read back - using the local file name."
            FILE_NAME=$(basename "$FILE" | tr ' ' '.')
            ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE_NAME"
          fi
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "Published $FILE_NAME"

      - name: Tell MyApps the build succeeded
        if: success()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"success\",\"artifact_url\":\"$ARTIFACT_URL\",\"file_name\":\"$FILE_NAME\"}"

      - name: Tell MyApps the build failed
        if: failure()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"failed\",\"message\":\"The desktop compiler stopped - open the Actions log for this run.\"}"

  macos:
    if: github.event.client_payload.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create the desktop shell
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p desktop/app
          APP_NAME=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); (p.app_name||"Desktop App").slice(0,60)')
          TARGET_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); p.build_type==="zip"?"":p.target_url||""')
          SLUG=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); String(p.app_name||"app").toLowerCase().replace(/[^a-z0-9]+/g,"")||"app"')
          cat > desktop/config.json <<JSON
          {
            "targetUrl": "$TARGET_URL",
            "appName": "$APP_NAME"
          }
          JSON
          cat > desktop/local-origin.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { net } = require('electron');
          const SCHEME = 'myapps';
          const ORIGIN = SCHEME + '://localhost/';
          const privileges = { standard: true, secure: true, supportFetchAPI: true, corsEnabled: true, stream: true };
          function installLocalOrigin(localSession, directory) {
            const root = fs.realpathSync(directory);
            const inside = (file) => file === root || file.startsWith(root + path.sep);
            localSession.protocol.handle(SCHEME, async (request) => {
              const url = new URL(request.url);
              if (url.host !== 'localhost') return new Response('Forbidden', { status: 403 });
              if (!['GET', 'HEAD'].includes(request.method)) return new Response('Method not allowed', { status: 405 });
              let pathname;
              try { pathname = decodeURIComponent(url.pathname); } catch { return new Response('Bad path', { status: 400 }); }
              if (pathname.includes('\\') || pathname.includes('\0')) return new Response('Bad path', { status: 400 });
              let file = path.resolve(root, '.' + pathname);
              if (!inside(file)) return new Response('Forbidden', { status: 403 });
              if (fs.existsSync(file) && fs.statSync(file).isDirectory()) file = path.join(file, 'index.html');
              if (!fs.existsSync(file)) {
                // Only documents get SPA fallback; missing JS/CSS must remain a real 404.
                const documentRequest = request.mode === 'navigate' || (request.headers.get('accept') || '').includes('text/html');
                if (!documentRequest || path.extname(pathname)) return new Response('Not found', { status: 404 });
                file = path.join(root, 'index.html');
              }
              if (!inside(fs.realpathSync(file)) || !fs.statSync(file).isFile()) return new Response('Forbidden', { status: 403 });
              const response = await net.fetch(pathToFileURL(file).href);
              const headers = new Headers(response.headers);
              headers.set('X-Content-Type-Options', 'nosniff');
              headers.set('Cache-Control', 'no-cache');
              return new Response(request.method === 'HEAD' ? null : response.body, { status: response.status, headers });
            });
          }
          module.exports = { SCHEME, ORIGIN, privileges, installLocalOrigin };
          MYAPPS_SCRIPT
          cat > desktop/verify-bundle.cjs <<'MYAPPS_SCRIPT'
          module.exports = async function verifyBundle(win, localSession, origin) {
            const assert = require('assert/strict');
            const html = await localSession.fetch(origin);
            assert.equal(html.status, 200);
            assert.match(html.headers.get('content-type') || '', /text\/html/);
            const index = await html.text();
            const deep = await localSession.fetch(origin + '__myapps_probe__/route', { headers: { Accept: 'text/html' } });
            assert.equal(deep.status, 200);
            assert.equal(await deep.text(), index, 'SPA document fallback differs from index.html');
            assert.equal((await localSession.fetch(origin + '__myapps_missing__.js')).status, 404);
            let checked = 0;
            for (const tag of index.match(/<(?:script|link)\b[^>]*>/gi) || []) {
              if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload)["']/i.test(tag)) continue;
              const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
              if (!match) continue;
              const url = new URL(match[1], origin);
              if (url.protocol !== 'myapps:') continue;
              const response = await localSession.fetch(url.href);
              assert.equal(response.status, 200, 'Entry asset missing: ' + url.href);
              assert.doesNotMatch(response.headers.get('content-type') || '', /text\/html/);
              checked++;
            }
            await win.loadURL(origin);
            const waitForContent = async () => {
              for (let attempt = 0; attempt < 60; attempt++) {
                const rendered = await win.webContents.executeJavaScript(
                  '(() => { const b=document.body.cloneNode(true); b.querySelectorAll("script,style,noscript").forEach(n=>n.remove()); return !!(b.textContent.trim() || b.querySelector("img,svg,canvas,video,iframe,input,button")); })()'
                );
                if (rendered) return;
                await new Promise((resolve) => setTimeout(resolve, 250));
              }
              throw new Error('The bundled app rendered an empty document after 15 seconds.');
            };
            await waitForContent();
            await win.webContents.executeJavaScript('history.pushState({}, "", "/__myapps_probe__/route")');
            await Promise.race([
              new Promise((resolve, reject) => {
                win.webContents.once('did-finish-load', resolve);
                win.webContents.once('did-fail-load', (_event, code, message) => reject(new Error(code + ': ' + message)));
                win.webContents.reload();
              }),
              new Promise((_, reject) => setTimeout(() => reject(new Error('SPA reload timed out.')), 20000)),
            ]);
            await waitForContent();
            assert.equal(new URL(win.webContents.getURL()).pathname, '/__myapps_probe__/route');
            console.log('MYAPPS_LOCAL_ORIGIN_VERIFIED ' + JSON.stringify({ origin, platform: process.platform, level: 'renderer', checked, spaFallback: true, historyReload: true }));
          };
          MYAPPS_SCRIPT
          cat > desktop/main.js <<'JS'
          const { app, BrowserWindow, shell, protocol, session } = require('electron');
          const fs = require('fs');
          const path = require('path');
          const config = require('./config.json');
          const local = require('./local-origin.cjs');
          const verifying = process.argv.includes('--verify-local-bundle');
          protocol.registerSchemesAsPrivileged([{ scheme: local.SCHEME, privileges: local.privileges }]);
          const startUrl = config.targetUrl || local.ORIGIN;
          const sameOrigin = (url) => {
            try { const a = new URL(startUrl), b = new URL(url); return a.protocol === b.protocol && a.host === b.host; }
            catch { return false; }
          };
          let localSession;
          let splash;
          // A splash window is shown only when the build shipped splash artwork.
          function showSplash() {
            if (verifying) return;
            if (!fs.existsSync(path.join(__dirname, 'splash.png'))) return;
            splash = new BrowserWindow({
              width: 600, height: 400, frame: false, resizable: false, backgroundColor: '#ffffff',
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            splash.loadFile(path.join(__dirname, 'splash.html'));
          }
          function closeSplash() {
            if (!splash) return;
            if (!splash.isDestroyed()) splash.destroy();
            splash = null;
          }
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200, height: 820, minWidth: 760, minHeight: 540,
              title: config.appName, autoHideMenuBar: true, backgroundColor: '#ffffff',
              show: false,
              webPreferences: { session: localSession, contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            win.webContents.on('will-navigate', (event, url) => {
              if (!sameOrigin(url)) {
                event.preventDefault();
                if (/^https?:/i.test(url)) shell.openExternal(url);
              }
            });
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.once('ready-to-show', () => {
              closeSplash();
              if (!verifying) win.show();
            });
            return win;
          }
          app.whenReady().then(async () => {
            localSession = session.fromPartition(verifying ? 'myapps-verification' : 'persist:myapps');
            if (!config.targetUrl) {
              local.installLocalOrigin(localSession, path.join(__dirname, 'app'));
              console.log('MYAPPS_LOCAL_ORIGIN_CONFIGURED ' + local.ORIGIN);
            }
            showSplash();
            const win = createWindow();
            if (verifying) {
              await require('./verify-bundle.cjs')(win, localSession, local.ORIGIN);
              app.exit(0);
            } else await win.loadURL(startUrl);
          }).catch((error) => { console.error(error); app.exit(1); });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          app.on('activate', () => {
            if (localSession && BrowserWindow.getAllWindows().length === 0) createWindow().loadURL(startUrl);
          });
          JS
          cat > desktop/splash.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <style>
                html, body { margin: 0; height: 100%; background: #ffffff; }
                body { display: flex; align-items: center; justify-content: center; }
                img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
              </style>
            </head>
            <body><img src="splash.png" alt="" /></body>
          </html>
          HTML
          cat > desktop/package.json <<JSON
          {
            "name": "$SLUG",
            "productName": "$APP_NAME",
            "version": "1.0.0",
            "main": "main.js",
            "author": "MyApps Convertor",
            "description": "$APP_NAME",
            "build": {
              "files": ["main.js", "local-origin.cjs", "verify-bundle.cjs", "config.json", "splash.html", "splash.*", "app/**/*"],
              "appId": "com.myapps.$SLUG",
              "productName": "$APP_NAME",
              "directories": { "output": "dist" },
              "win": { "target": "nsis" },
              "mac": { "target": "dmg", "category": "public.app-category.productivity" },
              "linux": { "target": "AppImage", "category": "Utility" }
            },
            "devDependencies": { "electron": "^33.0.0", "electron-builder": "^25.0.0" }
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync("desktop/package.json","utf8"))'
          echo "Desktop shell ready for $APP_NAME"

      - name: Unpack the uploaded codebase
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "desktop/app"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs desktop/app
          echo "The installers ship the app files, so they run without a connection."

      # Installers carry the app's own artwork. electron-builder converts the
      # square PNG into the format each operating system needs.
      - name: Apply the app icon
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          if [ -z "$ICON_URL" ]; then
            echo "No app icon was uploaded - using the default artwork."
            exit 0
          fi
          if curl -sSL --fail "$ICON_URL" -o desktop/icon.png; then
            node -e 'const fs=require("fs");const p="desktop/package.json";const pkg=JSON.parse(fs.readFileSync(p,"utf8"));pkg.build.icon="icon.png";fs.writeFileSync(p,JSON.stringify(pkg,null,2));'
            echo "Applied the uploaded app icon"
          else
            echo "::warning::The app icon could not be downloaded - using the default artwork."
          fi

      # A splash screen is applied where the desktop runtime shows one: the
      # Electron shell paints it while the main window loads.
      - name: Apply the splash screen
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          SPLASH_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.splash_screen_url||""')
          if [ -z "$SPLASH_URL" ]; then
            echo "No splash screen was uploaded - the app opens straight into its window."
            exit 0
          fi
          if curl -sSL --fail "$SPLASH_URL" -o desktop/splash.png; then
            echo "Applied the uploaded splash screen"
          else
            echo "::warning::The splash screen could not be downloaded - the app starts without one."
          fi

      - name: Install desktop tools
        shell: bash
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify the local bundle server
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # This flag is confined to the disposable hosted runner probe.
            # Installed apps retain Chromium's sandbox and normal web security.
            xvfb-run -a npx electron . --no-sandbox --verify-local-bundle
          else
            npx electron . --verify-local-bundle
          fi

      - name: Package the installer
        shell: bash
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never

      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          TAG=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").release_tag')
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          FILE=""
          for candidate in desktop/dist/*.dmg; do
            [ -f "$candidate" ] || continue
            case "$candidate" in *.blockmap) continue ;; esac
            FILE="$candidate"
            break
          done
          if [ -z "$FILE" ]; then
            echo "::error::The installer was not produced by the packaging step."
            ls -1 desktop/dist || true
            exit 1
          fi
          gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" --title "Desktop build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          # GitHub rewrites characters it does not keep in an asset name (spaces
          # become dots), so the link is read back from the published release
          # instead of being guessed from the local file name.
          ASSET_JQ='[.assets[] | select(.name | ascii_downcase | endswith(".dmg"))][0]'
          FILE_NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.name")
          ARTIFACT_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.browser_download_url")
          if [ -z "$FILE_NAME" ] || [ -z "$ARTIFACT_URL" ]; then
            echo "::warning::The published installer could not be read back - using the local file name."
            FILE_NAME=$(basename "$FILE" | tr ' ' '.')
            ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE_NAME"
          fi
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "Published $FILE_NAME"

      - name: Tell MyApps the build succeeded
        if: success()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"success\",\"artifact_url\":\"$ARTIFACT_URL\",\"file_name\":\"$FILE_NAME\"}"

      - name: Tell MyApps the build failed
        if: failure()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"failed\",\"message\":\"The desktop compiler stopped - open the Actions log for this run.\"}"

  linux:
    if: github.event.client_payload.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create the desktop shell
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p desktop/app
          APP_NAME=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); (p.app_name||"Desktop App").slice(0,60)')
          TARGET_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); p.build_type==="zip"?"":p.target_url||""')
          SLUG=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}"); String(p.app_name||"app").toLowerCase().replace(/[^a-z0-9]+/g,"")||"app"')
          cat > desktop/config.json <<JSON
          {
            "targetUrl": "$TARGET_URL",
            "appName": "$APP_NAME"
          }
          JSON
          cat > desktop/local-origin.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { net } = require('electron');
          const SCHEME = 'myapps';
          const ORIGIN = SCHEME + '://localhost/';
          const privileges = { standard: true, secure: true, supportFetchAPI: true, corsEnabled: true, stream: true };
          function installLocalOrigin(localSession, directory) {
            const root = fs.realpathSync(directory);
            const inside = (file) => file === root || file.startsWith(root + path.sep);
            localSession.protocol.handle(SCHEME, async (request) => {
              const url = new URL(request.url);
              if (url.host !== 'localhost') return new Response('Forbidden', { status: 403 });
              if (!['GET', 'HEAD'].includes(request.method)) return new Response('Method not allowed', { status: 405 });
              let pathname;
              try { pathname = decodeURIComponent(url.pathname); } catch { return new Response('Bad path', { status: 400 }); }
              if (pathname.includes('\\') || pathname.includes('\0')) return new Response('Bad path', { status: 400 });
              let file = path.resolve(root, '.' + pathname);
              if (!inside(file)) return new Response('Forbidden', { status: 403 });
              if (fs.existsSync(file) && fs.statSync(file).isDirectory()) file = path.join(file, 'index.html');
              if (!fs.existsSync(file)) {
                // Only documents get SPA fallback; missing JS/CSS must remain a real 404.
                const documentRequest = request.mode === 'navigate' || (request.headers.get('accept') || '').includes('text/html');
                if (!documentRequest || path.extname(pathname)) return new Response('Not found', { status: 404 });
                file = path.join(root, 'index.html');
              }
              if (!inside(fs.realpathSync(file)) || !fs.statSync(file).isFile()) return new Response('Forbidden', { status: 403 });
              const response = await net.fetch(pathToFileURL(file).href);
              const headers = new Headers(response.headers);
              headers.set('X-Content-Type-Options', 'nosniff');
              headers.set('Cache-Control', 'no-cache');
              return new Response(request.method === 'HEAD' ? null : response.body, { status: response.status, headers });
            });
          }
          module.exports = { SCHEME, ORIGIN, privileges, installLocalOrigin };
          MYAPPS_SCRIPT
          cat > desktop/verify-bundle.cjs <<'MYAPPS_SCRIPT'
          module.exports = async function verifyBundle(win, localSession, origin) {
            const assert = require('assert/strict');
            const html = await localSession.fetch(origin);
            assert.equal(html.status, 200);
            assert.match(html.headers.get('content-type') || '', /text\/html/);
            const index = await html.text();
            const deep = await localSession.fetch(origin + '__myapps_probe__/route', { headers: { Accept: 'text/html' } });
            assert.equal(deep.status, 200);
            assert.equal(await deep.text(), index, 'SPA document fallback differs from index.html');
            assert.equal((await localSession.fetch(origin + '__myapps_missing__.js')).status, 404);
            let checked = 0;
            for (const tag of index.match(/<(?:script|link)\b[^>]*>/gi) || []) {
              if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload)["']/i.test(tag)) continue;
              const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
              if (!match) continue;
              const url = new URL(match[1], origin);
              if (url.protocol !== 'myapps:') continue;
              const response = await localSession.fetch(url.href);
              assert.equal(response.status, 200, 'Entry asset missing: ' + url.href);
              assert.doesNotMatch(response.headers.get('content-type') || '', /text\/html/);
              checked++;
            }
            await win.loadURL(origin);
            const waitForContent = async () => {
              for (let attempt = 0; attempt < 60; attempt++) {
                const rendered = await win.webContents.executeJavaScript(
                  '(() => { const b=document.body.cloneNode(true); b.querySelectorAll("script,style,noscript").forEach(n=>n.remove()); return !!(b.textContent.trim() || b.querySelector("img,svg,canvas,video,iframe,input,button")); })()'
                );
                if (rendered) return;
                await new Promise((resolve) => setTimeout(resolve, 250));
              }
              throw new Error('The bundled app rendered an empty document after 15 seconds.');
            };
            await waitForContent();
            await win.webContents.executeJavaScript('history.pushState({}, "", "/__myapps_probe__/route")');
            await Promise.race([
              new Promise((resolve, reject) => {
                win.webContents.once('did-finish-load', resolve);
                win.webContents.once('did-fail-load', (_event, code, message) => reject(new Error(code + ': ' + message)));
                win.webContents.reload();
              }),
              new Promise((_, reject) => setTimeout(() => reject(new Error('SPA reload timed out.')), 20000)),
            ]);
            await waitForContent();
            assert.equal(new URL(win.webContents.getURL()).pathname, '/__myapps_probe__/route');
            console.log('MYAPPS_LOCAL_ORIGIN_VERIFIED ' + JSON.stringify({ origin, platform: process.platform, level: 'renderer', checked, spaFallback: true, historyReload: true }));
          };
          MYAPPS_SCRIPT
          cat > desktop/main.js <<'JS'
          const { app, BrowserWindow, shell, protocol, session } = require('electron');
          const fs = require('fs');
          const path = require('path');
          const config = require('./config.json');
          const local = require('./local-origin.cjs');
          const verifying = process.argv.includes('--verify-local-bundle');
          protocol.registerSchemesAsPrivileged([{ scheme: local.SCHEME, privileges: local.privileges }]);
          const startUrl = config.targetUrl || local.ORIGIN;
          const sameOrigin = (url) => {
            try { const a = new URL(startUrl), b = new URL(url); return a.protocol === b.protocol && a.host === b.host; }
            catch { return false; }
          };
          let localSession;
          let splash;
          // A splash window is shown only when the build shipped splash artwork.
          function showSplash() {
            if (verifying) return;
            if (!fs.existsSync(path.join(__dirname, 'splash.png'))) return;
            splash = new BrowserWindow({
              width: 600, height: 400, frame: false, resizable: false, backgroundColor: '#ffffff',
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            splash.loadFile(path.join(__dirname, 'splash.html'));
          }
          function closeSplash() {
            if (!splash) return;
            if (!splash.isDestroyed()) splash.destroy();
            splash = null;
          }
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200, height: 820, minWidth: 760, minHeight: 540,
              title: config.appName, autoHideMenuBar: true, backgroundColor: '#ffffff',
              show: false,
              webPreferences: { session: localSession, contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            win.webContents.on('will-navigate', (event, url) => {
              if (!sameOrigin(url)) {
                event.preventDefault();
                if (/^https?:/i.test(url)) shell.openExternal(url);
              }
            });
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.once('ready-to-show', () => {
              closeSplash();
              if (!verifying) win.show();
            });
            return win;
          }
          app.whenReady().then(async () => {
            localSession = session.fromPartition(verifying ? 'myapps-verification' : 'persist:myapps');
            if (!config.targetUrl) {
              local.installLocalOrigin(localSession, path.join(__dirname, 'app'));
              console.log('MYAPPS_LOCAL_ORIGIN_CONFIGURED ' + local.ORIGIN);
            }
            showSplash();
            const win = createWindow();
            if (verifying) {
              await require('./verify-bundle.cjs')(win, localSession, local.ORIGIN);
              app.exit(0);
            } else await win.loadURL(startUrl);
          }).catch((error) => { console.error(error); app.exit(1); });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          app.on('activate', () => {
            if (localSession && BrowserWindow.getAllWindows().length === 0) createWindow().loadURL(startUrl);
          });
          JS
          cat > desktop/splash.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <style>
                html, body { margin: 0; height: 100%; background: #ffffff; }
                body { display: flex; align-items: center; justify-content: center; }
                img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
              </style>
            </head>
            <body><img src="splash.png" alt="" /></body>
          </html>
          HTML
          cat > desktop/package.json <<JSON
          {
            "name": "$SLUG",
            "productName": "$APP_NAME",
            "version": "1.0.0",
            "main": "main.js",
            "author": "MyApps Convertor",
            "description": "$APP_NAME",
            "build": {
              "files": ["main.js", "local-origin.cjs", "verify-bundle.cjs", "config.json", "splash.html", "splash.*", "app/**/*"],
              "appId": "com.myapps.$SLUG",
              "productName": "$APP_NAME",
              "directories": { "output": "dist" },
              "win": { "target": "nsis" },
              "mac": { "target": "dmg", "category": "public.app-category.productivity" },
              "linux": { "target": "AppImage", "category": "Utility" }
            },
            "devDependencies": { "electron": "^33.0.0", "electron-builder": "^25.0.0" }
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync("desktop/package.json","utf8"))'
          echo "Desktop shell ready for $APP_NAME"

      - name: Unpack the uploaded codebase
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ZIP_URL=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").zip_url||""')
          if [ -z "$ZIP_URL" ]; then echo "::error::No codebase archive was provided."; exit 1; fi
          cat > /tmp/myapps-normalize-bundle.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          let rewritten = 0;
          let scanned = 0;
          function localFile(url) {
            const pathname = decodeURIComponent(url.split(/[?#]/)[0]);
            const full = path.resolve(root, '.' + pathname);
            return full.startsWith(root + path.sep) && fs.existsSync(full) && fs.statSync(full).isFile();
          }
          function normalize(url) {
            // Never rewrite external URLs, API calls, router paths, or computed JS strings.
            if (!/^\/(?!\/)/.test(url) || !/\.[a-z0-9]{1,8}(?:[?#]|$)/i.test(url)) return url;
            if (localFile(url)) return url;
            const segments = url.split('/');
            for (let i = 2; i < segments.length; i++) {
              const candidate = '/' + segments.slice(i).join('/');
              if (localFile(candidate)) { rewritten++; return candidate; }
            }
            return url;
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) throw new Error('Bundle symlinks are not supported: ' + entry.name);
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(html|css|[cm]?js)$/i.test(file)) continue;
              scanned++;
              let text = fs.readFileSync(file, 'utf8');
              // Quoted root paths in HTML and JS, and CSS url()/@import references.
              text = text.replace(/(["'\x60])(\/(?!\/)[^"'\x60\s<>]*?)\1/g,
                (match, quote, url) => quote + normalize(url) + quote);
              text = text.replace(/url\(\s*(\/(?!\/)[^\s)'"<>]+)\s*\)/g,
                (match, url) => 'url(' + normalize(url) + ')');
              text = text.replace(/(\bsrcset\s*=\s*["'])([^"']+)(["'])/gi,
                (match, start, values, end) => start + values.replace(/(^|,\s*)(\/[^\s,]+)/g,
                  (item, gap, url) => gap + normalize(url)) + end);
              if (file === path.join(root, 'index.html')) {
                // A stable base is essential when an SPA refreshes a nested route.
                if (/<base\b/i.test(text)) text = text.replace(/<base\b[^>]*>/gi, '');
                if (!/<head\b[^>]*>/i.test(text)) throw new Error('index.html needs a head element.');
                // A replacement function keeps the matched tag intact; "$&" is only a
                // placeholder, so any text placed around it must never rely on expansion.
                text = text.replace(/<head\b[^>]*>/i, (tag) => tag + '<base href="/">');
              }
              fs.writeFileSync(file, text);
            }
          }
          walk(root);
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          let entryAssets = 0;
          for (const tag of html.match(/<(?:script|link)\b[^>]*>/gi) || []) {
            if (/^<link/i.test(tag) && !/\brel\s*=\s*["'](?:stylesheet|modulepreload|preload)["']/i.test(tag)) continue;
            const match = tag.match(/\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (!match || /^(?:[a-z]+:|\/\/|#)/i.test(match[1])) continue;
            const url = new URL(match[1], 'https://localhost/');
            if (/\.(?:tsx?|jsx)$/i.test(url.pathname) || !localFile(url.pathname)) {
              throw new Error('Missing or uncompiled entry asset: ' + match[1] + '. Upload a browser-ready build.');
            }
            entryAssets++;
          }
          console.log('MYAPPS_ASSETS_NORMALIZED ' + JSON.stringify({ scanned, rewritten, entryAssets, base: '/' }));
          MYAPPS_SCRIPT
          prepare_codebase() {
            dest="$1"
            dl="/tmp/myapps-codebase.zip"
            work="/tmp/myapps-codebase"
            rm -rf "$work" "$dest"
            mkdir -p "$work"
            echo "Downloading the uploaded archive"
            curl -sSL --fail "$ZIP_URL" -o "$dl"
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dl")' -DestinationPath '$(cygpath -w "$work")' -Force"
            else
              unzip -q "$dl" -d "$work"
            fi

            # The shallowest index.html is the website's entry point.
            find_entry() {
              depth=1
              while [ "$depth" -le 5 ]; do
                hit=$(find "$1" -mindepth "$depth" -maxdepth "$depth" -name index.html \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)
                if [ -n "$hit" ]; then dirname "$hit"; return 0; fi
                depth=$((depth + 1))
              done
              return 1
            }

            # A project with a build script is a source tree - it has to be compiled.
            find_project() {
              if [ -f "$1/package.json" ]; then
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$1/package.json" >/dev/null 2>&1; then
                  printf '%s' "$1"; return 0
                fi
              fi
              find "$1" -mindepth 2 -maxdepth 3 -name package.json \
                -not -path '*/node_modules/*' -not -path '*/.git/*' -print > /tmp/myapps-manifests.txt 2>/dev/null || true
              while read -r manifest; do
                if node -e 'const p=require(process.argv[1]);process.exit(p.scripts&&p.scripts.build?0:1)' "$manifest" >/dev/null 2>&1; then
                  dirname "$manifest"; return 0
                fi
              done < /tmp/myapps-manifests.txt
              return 1
            }

            # Where a compiled project puts the files that run in a browser.
            find_output() {
              for candidate in dist out build .next/out .output/public site _site public www; do
                if [ -f "$1/$candidate/index.html" ]; then printf '%s' "$1/$candidate"; return 0; fi
              done
              if [ -n "$2" ]; then
                fresh=$(find "$1" -maxdepth 4 -name index.html -newer "$2" \
                  -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit 2>/dev/null || true)
                if [ -n "$fresh" ]; then dirname "$fresh"; return 0; fi
              fi
              return 1
            }

            root=""
            project=$(find_project "$work" || true)
            if [ -n "$project" ]; then
              echo "Found a source project - running its build command"
              stamp=/tmp/myapps-build-stamp
              touch "$stamp"
              # A source project can read the original site address while it compiles.
              SITE_URL=$(node -p 'const p=JSON.parse(process.env.PAYLOAD||"{}");const c=p.app_config||{};String(c.site_url||p.website_url||"")' || true)
              (
                cd "$project"
                if [ -n "${SITE_URL:-}" ]; then
                  export VITE_APP_URL="$SITE_URL"
                  export REACT_APP_API_URL="$SITE_URL"
                  export NEXT_PUBLIC_APP_URL="$SITE_URL"
                fi
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm install --no-audit --no-fund
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              )
              root=$(find_output "$project" "$stamp" || true)
              if [ -z "$root" ]; then
                echo "::error::The build did not produce a static site. Export browser-ready output (dist, build or out); a server-only app cannot run offline."
                exit 1
              fi
            fi
            if [ -z "$root" ]; then root=$(find_entry "$work" || true); fi

            if [ -z "$root" ] || [ ! -f "$root/index.html" ]; then
              echo "::error::No browser-ready site was found in the archive. Upload a built site with index.html at its root, or a project whose build command produces one."
              echo "Files found in the archive:"
              ls -1 "$work" | head -n 15 || true
              exit 1
            fi

            mkdir -p "$dest"
            cp -R "$root/." "$dest/"
            echo "Bundling the site from $(basename "$root")"
            node /tmp/myapps-normalize-bundle.cjs "$dest"
            echo "Bundled $(find "$dest" -type f | wc -l) files into the app"
          }
          prepare_codebase "desktop/app"
          cat > /tmp/myapps-runtime-config.cjs <<'MYAPPS_SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const config = payload.app_config || {};
          const raw = String(config.site_url || payload.website_url || '').trim();
          const siteUrl = /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d{2,5})?(\/\S*)?$/i.test(raw) ? raw.replace(/\/+$/, '') : '';

          if (!fs.existsSync(root)) {
            console.error('::error::The app files are missing, so the runtime configuration could not be written.');
            process.exit(1);
          }

          const runtime = {
            appName: String(config.app_name || payload.app_name || ''),
            platform: String(config.platform || payload.platform || ''),
            siteUrl: siteUrl,
            apiBase: siteUrl,
            offlineBundle: true,
          };
          fs.writeFileSync(path.join(root, 'myapps-runtime-config.json'), JSON.stringify(runtime, null, 2));

          const entry = path.join(root, 'index.html');
          if (!fs.existsSync(entry)) {
            console.error('::error::The app files have no index.html to carry the runtime configuration.');
            process.exit(1);
          }

          let html = fs.readFileSync(entry, 'utf8');
          if (html.indexOf('__MYAPPS_CONFIG__') === -1) {
            const bag = JSON.stringify(runtime).replace(/</g, '\u003c');
            const tag = '<script>window.__MYAPPS_CONFIG__=' + bag +
              ';window.__MYAPPS_SITE_URL__=' + JSON.stringify(siteUrl) +
              ';window.MyApps=window.MyApps||{};window.MyApps.config=window.__MYAPPS_CONFIG__;</script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, () => tag + '</body>') : html + tag;
            fs.writeFileSync(entry, html);
          }

          console.log('MYAPPS_RUNTIME_CONFIG ' + JSON.stringify({ siteUrl: siteUrl, apiBase: siteUrl, configFile: 'myapps-runtime-config.json' }));
          MYAPPS_SCRIPT
          node /tmp/myapps-runtime-config.cjs desktop/app
          echo "The installers ship the app files, so they run without a connection."

      # Installers carry the app's own artwork. electron-builder converts the
      # square PNG into the format each operating system needs.
      - name: Apply the app icon
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          ICON_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.logo_url||""')
          if [ -z "$ICON_URL" ]; then
            echo "No app icon was uploaded - using the default artwork."
            exit 0
          fi
          if curl -sSL --fail "$ICON_URL" -o desktop/icon.png; then
            node -e 'const fs=require("fs");const p="desktop/package.json";const pkg=JSON.parse(fs.readFileSync(p,"utf8"));pkg.build.icon="icon.png";fs.writeFileSync(p,JSON.stringify(pkg,null,2));'
            echo "Applied the uploaded app icon"
          else
            echo "::warning::The app icon could not be downloaded - using the default artwork."
          fi

      # A splash screen is applied where the desktop runtime shows one: the
      # Electron shell paints it while the main window loads.
      - name: Apply the splash screen
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          SPLASH_URL=$(node -p 'const c=(JSON.parse(process.env.PAYLOAD||"{}").app_config||{}); c.splash_screen_url||""')
          if [ -z "$SPLASH_URL" ]; then
            echo "No splash screen was uploaded - the app opens straight into its window."
            exit 0
          fi
          if curl -sSL --fail "$SPLASH_URL" -o desktop/splash.png; then
            echo "Applied the uploaded splash screen"
          else
            echo "::warning::The splash screen could not be downloaded - the app starts without one."
          fi

      - name: Install desktop tools
        shell: bash
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify the local bundle server
        if: github.event.client_payload.build_type == 'zip'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # This flag is confined to the disposable hosted runner probe.
            # Installed apps retain Chromium's sandbox and normal web security.
            xvfb-run -a npx electron . --no-sandbox --verify-local-bundle
          else
            npx electron . --verify-local-bundle
          fi

      - name: Package the installer
        shell: bash
        working-directory: desktop
        run: npx electron-builder --linux AppImage --publish never

      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          TAG=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").release_tag')
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          FILE=""
          for candidate in desktop/dist/*.AppImage; do
            [ -f "$candidate" ] || continue
            case "$candidate" in *.blockmap) continue ;; esac
            FILE="$candidate"
            break
          done
          if [ -z "$FILE" ]; then
            echo "::error::The installer was not produced by the packaging step."
            ls -1 desktop/dist || true
            exit 1
          fi
          gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" --title "Desktop build $BUILD_ID" --notes "Compiled by MyApps Convertor" >/dev/null || gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
          # GitHub rewrites characters it does not keep in an asset name (spaces
          # become dots), so the link is read back from the published release
          # instead of being guessed from the local file name.
          ASSET_JQ='[.assets[] | select(.name | ascii_downcase | endswith(".AppImage"))][0]'
          FILE_NAME=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.name")
          ARTIFACT_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq "$ASSET_JQ.browser_download_url")
          if [ -z "$FILE_NAME" ] || [ -z "$ARTIFACT_URL" ]; then
            echo "::warning::The published installer could not be read back - using the local file name."
            FILE_NAME=$(basename "$FILE" | tr ' ' '.')
            ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE_NAME"
          fi
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "Published $FILE_NAME"

      - name: Tell MyApps the build succeeded
        if: success()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"success\",\"artifact_url\":\"$ARTIFACT_URL\",\"file_name\":\"$FILE_NAME\"}"

      - name: Tell MyApps the build failed
        if: failure()
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          BUILD_ID=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").build_id')
          PLATFORM=$(node -p 'JSON.parse(process.env.PAYLOAD||"{}").platform')
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-secret: $WEBHOOK_SECRET" -d "{\"secret\":\"$WEBHOOK_SECRET\",\"build_id\":\"$BUILD_ID\",\"platform\":\"$PLATFORM\",\"status\":\"failed\",\"message\":\"The desktop compiler stopped - open the Actions log for this run.\"}"
